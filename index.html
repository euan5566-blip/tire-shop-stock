<script>

let user=null,profile=null,page="dashboard",products=[],customers=[],vehicles=[],cart=[],quoteCart=[],purchaseCart=[],currency="LAK",exchangeRate=1;
async function boot(){const {data:{session}}=await sb.auth.getSession();user=session?.user||null;user?await enterApp():loginPage();sb.auth.onAuthStateChange(async(_e,s)=>{user=s?.user||null;if(user)await enterApp();else loginPage()})}
async function enterApp(){const {data,error}=await sb.from("profiles").select("*").eq("id",user.id).single();if(error||!data?.active){root.innerHTML='<div class="login"><div class="card loginbox"><h2>ບັນຊີບໍ່ໄດ້ເປີດໃຊ້</h2><p>ຕິດຕໍ່ເຈົ້າຂອງຮ້ານ</p><button class="btn" onclick="logout()">ອອກຈາກລະບົບ</button></div></div>';return}profile=data;renderApp()}
function loginPage(){root.innerHTML='<div class="login"><div class="card loginbox"><h1>🛞 ລະບົບຮ້ານຢາງ</h1><p class="muted">ລະບົບຂາຍ ແລະ ສະຕັອກສິນຄ້າ</p><div class="field"><label>ອີເມວ</label><input id="email" type="email"></div><div class="field" style="margin-top:10px"><label>ລະຫັດຜ່ານ</label><input id="pw" type="password"></div><div id="msg"></div><button class="btn" style="width:100%;margin-top:12px" onclick="login()">ເຂົ້າລະບົບ</button><button class="btn secondary" style="width:100%;margin-top:8px" onclick="signup()">ສ້າງບັນຊີເຈົ້າຂອງຮ້ານ</button><p class="muted" style="font-size:12px">ສ້າງບັນຊີຄັ້ງທຳອິດເພື່ອເລີ່ມໃຊ້ລະບົບ</p></div></div>'}
async function login(){const {error}=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("pw").value});if(error)msg.innerHTML='<div class="notice error">'+esc(error.message)+'</div>'}
async function signup(){const email=$("email").value.trim(),password=$("pw").value;if(password.length<6){msg.innerHTML='<div class="notice error">ລະຫັດຜ່ານຕ້ອງມີຢ່າງໜ້ອຍ 6 ຕົວ</div>';return}const {error}=await sb.auth.signUp({email,password});msg.innerHTML=error?'<div class="notice error">'+esc(error.message)+'</div>':'<div class="notice success">ສ້າງບັນຊີແລ້ວ. ຖ້າລະບົບຂໍຢືນຢັນອີເມວ ກະລຸນາເປີດອີເມວກ່ອນເຂົ້າລະບົບ.</div>'}

function nav(id,label){return '<button class="'+(page===id?'active':'')+'" onclick="page=\''+id+'\';renderApp()">'+label+'</button>'}
async function q(t,opts={}){let x=sb.from(t).select(opts.select||"*");if(opts.order)x=x.order(opts.order,{ascending:opts.asc??false});if(opts.limit)x=x.limit(opts.limit);const {data,error}=await x;if(error)throw error;return data||[]}
async function loadPage(){main.innerHTML='<div class="card">ກຳລັງໂຫຼດ...</div>';try{if(page==="dashboard")await dashboard();if(page==="products")await productsPage();if(page==="sales")await salesPage();if(page==="quotes")await quotesPage();if(page==="customers")await customersPage();if(page==="purchases")await purchasesPage();if(page==="expenses")await expensesPage();if(page==="reports")await reportsPage()}catch(e){main.innerHTML='<div class="notice error">'+esc(e.message||e)+'</div>'}}
async function dashboard(){const ps=await q("products"),ss=await q("sales",{order:"created_at",asc:false}),es=await q("expenses",{order:"expense_date",asc:false});const today=dateToday(),s=ss.filter(x=>x.sale_date===today),sales=s.reduce((a,x)=>a+Number(x.total||0),0),profit=s.reduce((a,x)=>a+Number(x.profit||0),0),low=ps.filter(x=>x.stock<=x.min_stock).length;main.innerHTML='<h1>📊 ໜ້າຫຼັກ</h1><div class="grid g4"><div class="card">ຍອດຂາຍມື້ນີ້<div class="stat">'+money(sales)+' ₭</div></div><div class="card">ກຳໄລຂັ້ນຕົ້ນ<div class="stat">'+money(profit)+' ₭</div></div><div class="card">ສິນຄ້າທັງໝົດ<div class="stat">'+ps.length+'</div></div><div class="card">ສິນຄ້າໃກ້ໝົດ<div class="stat">'+low+'</div></div></div><div class="grid g2" style="margin-top:14px"><div class="card"><h2>ສິນຄ້າໃກ້ໝົດ</h2>'+ps.filter(x=>x.stock<=x.min_stock).slice(0,12).map(x=>'<div class="between" style="padding:8px;border-bottom:1px solid #eee"><span>'+esc(x.name)+'</span><b>'+x.stock+'</b></div>').join("")+'</div><div class="card"><h2>ລາຍຈ່າຍຫຼ້າສຸດ</h2>'+es.slice(0,10).map(x=>'<div class="between" style="padding:8px;border-bottom:1px solid #eee"><span>'+esc(x.title)+'</span><b>'+money(x.amount)+'</b></div>').join("")+'</div></div>'}
async function productsPage(){products=await q("products",{order:"created_at",asc:false});main.innerHTML='<div class="between"><h1>📦 ສິນຄ້າ / ສະຕັອກ</h1><button class="btn" onclick="productModal()">➕ ເພີ່ມສິນຄ້າ</button></div><div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>ຊື່ສິນຄ້າ</th><th>ໝວດ</th><th>ຂະໜາດ</th><th>ຈຳນວນ</th><th>ທຶນ (₭)</th><th>ຂາຍ (₭)</th><th></th></tr></thead><tbody>'+products.map(p=>'<tr><td><b>'+esc(p.name)+'</b></td><td>'+esc(p.category||"-")+'</td><td>'+esc(p.size||"-")+'</td><td><span class="pill '+(p.stock<=p.min_stock?"low":"good")+'">'+p.stock+'</span></td><td>'+money(p.cost_lak||p.cost)+'</td><td>'+money(p.price_lak||p.price)+'</td><td><button class="btn secondary" onclick="productModal(\''+p.id+'\')">ແກ້ໄຂ</button> <button class="btn danger" onclick="deleteProduct(\''+p.id+'\')">ລຶບ</button></td></tr>').join("")+'</tbody></table></div></div>'}
function productModal(id){const p=products.find(x=>x.id===id)||{name:"",category:"ຢາງລົດ",sku:"",barcode:"",brand:"",model:"",size:"",stock:0,min_stock:0,cost_lak:0,price_lak:0,cost_thb:0,price_thb:0,unit:"ເສັ້ນ"};root.insertAdjacentHTML("beforeend",'<div class="modal" id="modal"><div class="modalbox"><div class="between"><h2>'+(id?"ແກ້ໄຂສິນຄ້າ":"ເພີ່ມສິນຄ້າ")+'</h2><button class="btn secondary" onclick="closeModal()">ປິດ</button></div><div class="grid g3"><div class="field"><label>ຊື່ສິນຄ້າ *</label><input id="pn" value="'+esc(p.name)+'"></div><div class="field"><label>ໝວດໝູ່</label><select id="pc"><option>ຢາງລົດ</option><option>ນ້ຳມັນເຄື່ອງ</option><option>ນ້ຳມັນເກຍ</option><option>ອະໄຫຼ່</option><option>ອື່ນໆ</option></select></div><div class="field"><label>SKU</label><input id="psku" value="'+esc(p.sku||"")+'"></div><div class="field"><label>ຍີ່ຫໍ້</label><input id="pb" value="'+esc(p.brand||"")+'"></div><div class="field"><label>ຂະໜາດ/ລຸ້ນ</label><input id="psz" value="'+esc(p.size||p.model||"")+'"></div><div class="field"><label>ບາໂຄດ</label><input id="pbar" value="'+esc(p.barcode||"")+'"></div><div class="field"><label>ຈຳນວນໃນສະຕັອກ</label><input id="pq" type="number" min="0" value="'+p.stock+'"></div><div class="field"><label>ຈຳນວນແຈ້ງເຕືອນ</label><input id="pmin" type="number" min="0" value="'+p.min_stock+'"></div><div class="field"><label>ທຶນ (ກີບ)</label><input id="pcost" type="number" min="0" value="'+(p.cost_lak||p.cost)+'"></div><div class="field"><label>ລາຄາຂາຍ (ກີບ)</label><input id="pprice" type="number" min="0" value="'+(p.price_lak||p.price)+'"></div><div class="field"><label>ທຶນ (ບາດ)</label><input id="pcth" type="number" min="0" value="'+(p.cost_thb||0)+'"></div><div class="field"><label>ລາຄາຂາຍ (ບາດ)</label><input id="ppth" type="number" min="0" value="'+(p.price_thb||0)+'"></div></div><div id="pmsg"></div><button class="btn" style="width:100%;margin-top:14px" onclick="saveProduct(\''+(id||"")+'\')">ບັນທຶກ</button></div></div>');$("pc").value=p.category||"ຢາງລົດ"}
async function saveProduct(id){const d={name:$("pn").value.trim(),category:$("pc").value,sku:$("psku").value.trim()||null,brand:$("pb").value.trim()||null,size:$("psz").value.trim()||null,model:$("psz").value.trim()||null,barcode:$("pbar").value.trim()||null,stock:Number($("pq").value||0),min_stock:Number($("pmin").value||0),cost_lak:Number($("pcost").value||0),price_lak:Number($("pprice").value||0),cost_thb:Number($("pcth").value||0),price_thb:Number($("ppth").value||0),cost:Number($("pcost").value||0),price:Number($("pprice").value||0),unit:"ເສັ້ນ",active:true};if(!d.name){pmsg.innerHTML='<div class="notice error">ກະລຸນາກອກຊື່ສິນຄ້າ</div>';return}let r=id?await sb.from("products").update(d).eq("id",id):await sb.from("products").insert(d);if(r.error){pmsg.innerHTML='<div class="notice error">'+esc(r.error.message)+'</div>';return}closeModal();productsPage()}
async function deleteProduct(id){if(!confirm("ລຶບສິນຄ້ານີ້?"))return;const r=await sb.from("products").delete().eq("id",id);if(r.error)alert(r.error.message);else productsPage()}
function closeModal(){document.getElementById("modal")?.remove()}
async function customersPage(){customers=await q("customers",{order:"created_at",asc:false});main.innerHTML='<div class="between"><h1>👤 ລູກຄ້າ</h1><button class="btn" onclick="customerModal()">➕ ເພີ່ມລູກຄ້າ</button></div><div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>ຊື່</th><th>ເບີໂທ</th><th>ທີ່ຢູ່</th><th></th></tr></thead><tbody>'+customers.map(c=>'<tr><td>'+esc(c.name)+'</td><td>'+esc(c.phone||"-")+'</td><td>'+esc(c.address||"-")+'</td><td><button class="btn danger" onclick="deleteCustomer(\''+c.id+'\')">ລຶບ</button></td></tr>').join("")+'</tbody></table></div></div>'}
function customerModal(){root.insertAdjacentHTML("beforeend",'<div class="modal" id="modal"><div class="modalbox"><h2>ເພີ່ມລູກຄ້າ</h2><div class="grid g2"><div class="field"><label>ຊື່ *</label><input id="cn"></div><div class="field"><label>ເບີໂທ</label><input id="ct"></div><div class="field"><label>ທີ່ຢູ່</label><input id="ca"></div></div><button class="btn" style="margin-top:12px;width:100%" onclick="saveCustomer()">ບັນທຶກ</button></div></div>')}
async function saveCustomer(){const r=await sb.from("customers").insert({name:$("cn").value.trim(),phone:$("ct").value.trim()||null,address:$("ca").value.trim()||null});if(r.error)alert(r.error.message);else{closeModal();customersPage()}}
async function deleteCustomer(id){if(confirm("ລຶບລູກຄ້ານີ້?")){const r=await sb.from("customers").delete().eq("id",id);if(r.error)alert(r.error.message);else customersPage()}}
async function salesPage(){products=await q("products",{order:"name",asc:true});customers=await q("customers",{order:"name",asc:true});vehicles=await q("vehicles",{order:"plate",asc:true});cart=[];main.innerHTML='<div class="between"><h1>🧾 ຂາຍສິນຄ້າ</h1><select id="cur" onchange="currency=this.value;renderCart()"><option value="LAK">ກີບ (LAK)</option><option value="THB">ບາດ (THB)</option></select></div><div class="grid g2"><div class="card"><h2>ເລືອກສິນຄ້າ</h2><div class="row"><select id="addprod" style="flex:1;padding:10px;border:1px solid #cbd5e1;border-radius:9px"><option value="">-- ເລືອກ --</option>'+products.filter(p=>p.stock>0).map(p=>'<option value="'+p.id+'">'+esc(p.name)+' | '+p.stock+' | '+money(p.price_lak||p.price)+' ₭</option>').join("")+'</select><button class="btn" onclick="addCart()">ເພີ່ມ</button></div><div id="cart" style="margin-top:12px"></div></div><div class="card"><h2>ຂໍ້ມູນການຂາຍ</h2><div class="field"><label>ລູກຄ້າ</label><select id="sc"><option value="">ລູກຄ້າທົ່ວໄປ</option>'+customers.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join("")+'</select></div><div class="field" style="margin-top:10px"><label>ວິທີຊຳລະ</label><select id="sp"><option>ເງິນສົດ</option><option>ໂອນ</option><option>ເຄຣດິດ</option></select></div><div class="field" style="margin-top:10px"><label>ສ່ວນຫຼຸດ</label><input id="sd" type="number" min="0" value="0"></div><div class="field" style="margin-top:10px"><label>ຮັບເງິນແລ້ວ</label><input id="paid" type="number" min="0" value="0"></div><div class="field" style="margin-top:10px"><label>ໝາຍເຫດ</label><input id="sn"></div><div class="between" style="margin-top:12px"><span>ລວມທັງໝົດ</span><span id="cartTotal" class="total">0</span></div><button class="btn ok" style="width:100%;margin-top:12px" onclick="completeSale()">ບັນທຶກ ແລະ ພິມໃບບິນ A4</button></div></div>'}
function addCart(){const id=$("addprod").value,p=products.find(x=>x.id===id);if(!p)return;const x=cart.find(i=>i.product_id===id);if(x)x.qty=Math.min(x.qty+1,p.stock);else cart.push({product_id:id,name:p.name,qty:1,price:currency==="THB"?(p.price_thb||0):(p.price_lak||p.price),cost:currency==="THB"?(p.cost_thb||0):(p.cost_lak||p.cost),stock:p.stock});renderCart()}
function renderCart(){const el=$("cart");if(!el)return;cart.forEach(x=>{const p=products.find(p=>p.id===x.product_id);x.price=currency==="THB"?(p.price_thb||0):(p.price_lak||p.price);x.cost=currency==="THB"?(p.cost_thb||0):(p.cost_lak||p.cost)});el.innerHTML=cart.map((x,i)=>'<div class="cartitem"><div><b>'+esc(x.name)+'</b><div class="muted">'+money(x.price)+' / ໜ່ວຍ</div></div><input type="number" min="1" max="'+x.stock+'" value="'+x.qty+'" onchange="cartQty('+i+',this.value)"><b>'+money(x.qty*x.price)+'</b><button class="btn danger" onclick="cart.splice('+i+',1);renderCart()">×</button></div>').join("")||'<span class="muted">ຍັງບໍ່ມີສິນຄ້າ</span>';if($("cartTotal"))$("cartTotal").textContent=money(Math.max(cart.reduce((a,x)=>a+x.qty*x.price,0)-Number($("sd")?.value||0),0))+" "+(currency==="THB"?"฿":"₭")}
function cartQty(i,v){cart[i].qty=Math.max(1,Math.min(Number(v)||1,cart[i].stock));renderCart()}
async function completeSale(){if(!cart.length){alert("ເລືອກສິນຄ້າກ່ອນ");return}const subtotal=cart.reduce((a,x)=>a+x.qty*x.price,0),discount=Number($("sd").value||0),total=Math.max(subtotal-discount,0),paid=Number($("paid").value||0);const {data,error}=await sb.rpc("create_shop_sale",{p_customer_id:$("sc").value||null,p_vehicle_id:null,p_payment_method:$("sp").value,p_currency:currency,p_exchange_rate:exchangeRate,p_discount:discount,p_paid_amount:paid,p_note:$("sn").value.trim(),p_items:cart.map(x=>({product_id:x.product_id,qty:x.qty,unit_price:x.price}))});if(error){alert(error.message);return}printDoc("ໃບບິນຂາຍ",data.receipt_no,cart,total,currency,profile.full_name);cart=[];salesPage()}
async function quotesPage(){products=await q("products",{order:"name",asc:true});customers=await q("customers",{order:"name",asc:true});quoteCart=[];main.innerHTML='<div class="between"><h1>📄 ໃບສະເໜີລາຄາ</h1><span class="pill">ພິມເຈ້ຍ A4</span></div><div class="grid g2"><div class="card"><h2>ລາຍການ</h2><div class="row"><select id="qprod" style="flex:1;padding:10px;border:1px solid #cbd5e1;border-radius:9px"><option value="">ເລືອກສິນຄ້າ</option>'+products.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join("")+'</select><button class="btn" onclick="addQuoteItem()">ເພີ່ມ</button></div><div id="qcart"></div></div><div class="card"><h2>ລາຍລະອຽດໃບສະເໜີ</h2><div class="field"><label>ລູກຄ້າ</label><select id="qc"><option value="">ລູກຄ້າທົ່ວໄປ</option>'+customers.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join("")+'</select></div><div class="field" style="margin-top:10px"><label>ໃຊ້ໄດ້ເຖິງ</label><input id="qv" type="date"></div><div class="field" style="margin-top:10px"><label>ໝາຍເຫດ</label><input id="qn"></div><div class="between" style="margin-top:12px"><b>ລວມ</b><span id="qtotal" class="total">0 ₭</span></div><button class="btn" style="width:100%;margin-top:12px" onclick="saveQuote()">ບັນທຶກ ແລະ ພິມ A4</button></div></div><div class="card" style="margin-top:14px"><h2>ໃບສະເໜີລາຄາຫຼ້າສຸດ</h2><div id="qlist"></div></div>';await listQuotes()}
function addQuoteItem(){const p=products.find(x=>x.id===$("qprod").value);if(!p)return;quoteCart.push({product_id:p.id,name:p.name,qty:1,price:p.price_lak||p.price});renderQuoteCart()}
function renderQuoteCart(){qcart.innerHTML=quoteCart.map((x,i)=>'<div class="cartitem"><b>'+esc(x.name)+'</b><input type="number" min="1" value="'+x.qty+'" onchange="quoteCart['+i+'].qty=Math.max(1,Number(this.value)||1);renderQuoteCart()"><b>'+money(x.qty*x.price)+'</b><button class="btn danger" onclick="quoteCart.splice('+i+',1);renderQuoteCart()">×</button></div>').join("");qtotal.textContent=money(quoteCart.reduce((a,x)=>a+x.qty*x.price,0))+" ₭"}
async function saveQuote(){if(!quoteCart.length){alert("ເພີ່ມລາຍການກ່ອນ");return}const total=quoteCart.reduce((a,x)=>a+x.qty*x.price,0);const {data,error}=await sb.from("quotations").insert({customer_id:$("qc").value||null,valid_until:$("qv").value||null,currency:"LAK",exchange_rate:1,subtotal:total,total:total,note:$("qn").value.trim(),created_by:user.id}).select().single();if(error){alert(error.message);return}const rows=quoteCart.map(x=>({quotation_id:data.id,product_id:x.product_id,product_name:x.name,qty:x.qty,unit_price:x.price,line_total:x.qty*x.price}));const r=await sb.from("quotation_items").insert(rows);if(r.error){alert(r.error.message);return}printDoc("ໃບສະເໜີລາຄາ",data.quote_no,quoteCart,total,"LAK",profile.full_name);quoteCart=[];await listQuotes()}
async function listQuotes(){const {data,error}=await sb.from("quotations").select("id,quote_no,quote_date,total,status").order("created_at",{ascending:false}).limit(30);if(error){qlist.textContent=error.message;return}qlist.innerHTML='<div class="tablewrap"><table class="table"><thead><tr><th>ເລກທີ</th><th>ວັນທີ</th><th>ລວມ</th><th>ສະຖານະ</th><th></th></tr></thead><tbody>'+data.map(x=>'<tr><td>'+esc(x.quote_no)+'</td><td>'+esc(x.quote_date)+'</td><td>'+money(x.total)+' ₭</td><td>'+esc(x.status)+'</td><td><button class="btn secondary" onclick="printQuote(\''+x.id+'\')">ພິມ</button></td></tr>').join("")+'</tbody></table></div>'}
async function printQuote(id){const {data,error}=await sb.from("quotations").select("*,quotation_items(*)").eq("id",id).single();if(error){alert(error.message);return}printDoc("ໃບສະເໜີລາຄາ",data.quote_no,data.quotation_items.map(x=>({name:x.product_name,qty:x.qty,price:x.unit_price})),data.total,"LAK",profile.full_name)}
function printDoc(title,no,items,total,cur,operator){const pa=document.createElement("div");pa.className="printarea";pa.innerHTML='<h1 style="text-align:center">ຮ້ານຢາງລົດ</h1><h2 style="text-align:center">'+title+'</h2><p>ເລກທີ: '+esc(no)+' | ວັນທີ: '+dateToday()+'</p><p>ຜູ້ອອກເອກະສານ: '+esc(operator||"")+'</p><table style="width:100%;border-collapse:collapse" border="1" cellpadding="8"><thead><tr><th>ລ/ດ</th><th>ລາຍການ</th><th>ຈຳນວນ</th><th>ລາຄາ</th><th>ລວມ</th></tr></thead><tbody>'+items.map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(x.name||x.product_name)+'</td><td>'+x.qty+'</td><td>'+money(x.price||x.unit_price)+'</td><td>'+money(x.qty*(x.price||x.unit_price))+'</td></tr>').join("")+'</tbody></table><h2 style="text-align:right">ລວມ: '+money(total)+' '+(cur==="THB"?"฿":"₭")+'</h2><p style="margin-top:50px">ລາຍເຊັນຜູ້ຂາຍ: ____________________ &nbsp;&nbsp; ລາຍເຊັນລູກຄ້າ: ____________________</p>';document.body.appendChild(pa);window.print();pa.remove()}
async function purchasesPage(){products=await q("products",{order:"name",asc:true});main.innerHTML='<div class="between"><h1>🚚 ຮັບສິນຄ້າ / ເພີ່ມສະຕັອກ</h1></div><div class="grid g2"><div class="card"><h2>ເລືອກສິນຄ້າ</h2><div class="row"><select id="bprod" style="flex:1;padding:10px;border:1px solid #cbd5e1;border-radius:9px"><option value="">ສິນຄ້າ</option>'+products.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join("")+'</select><button class="btn" onclick="addPurchase()">ເພີ່ມ</button></div><div id="bcart"></div></div><div class="card"><h2>ລາຍລະອຽດ</h2><div class="field"><label>ເລກບິນ/ຜູ້ສະໜອງ</label><input id="bn"></div><div class="field" style="margin-top:10px"><label>ຈ່າຍແລ້ວ (₭)</label><input id="bpaid" type="number" min="0" value="0"></div><div class="field" style="margin-top:10px"><label>ໝາຍເຫດ</label><input id="bnote"></div><div class="between" style="margin-top:12px"><b>ລວມ</b><span id="btotal" class="total">0 ₭</span></div><button class="btn" style="width:100%;margin-top:12px" onclick="savePurchase()">ບັນທຶກຮັບເຂົ້າ</button></div></div><div class="card" style="margin-top:14px"><h2>ປະຫວັດຮັບສິນຄ້າ</h2><div id="blist"></div></div>';purchaseCart=[];await listPurchases()}
function addPurchase(){const p=products.find(x=>x.id===$("bprod").value);if(!p)return;purchaseCart.push({product_id:p.id,name:p.name,qty:1,unit_cost:p.cost_lak||p.cost});renderPurchaseCart()}
let purchaseCart=[];
function renderPurchaseCart(){bcart.innerHTML=purchaseCart.map((x,i)=>'<div class="cartitem"><b>'+esc(x.name)+'</b><input type="number" min="1" value="'+x.qty+'" onchange="purchaseCart['+i+'].qty=Math.max(1,Number(this.value)||1);renderPurchaseCart()"><input type="number" min="0" value="'+x.unit_cost+'" onchange="purchaseCart['+i+'].unit_cost=Math.max(0,Number(this.value)||0);renderPurchaseCart()"><button class="btn danger" onclick="purchaseCart.splice('+i+',1);renderPurchaseCart()">×</button></div>').join("");btotal.textContent=money(purchaseCart.reduce((a,x)=>a+x.qty*x.unit_cost,0))+" ₭"}
async function savePurchase(){if(!purchaseCart.length){alert("ເພີ່ມລາຍການກ່ອນ");return}const {data,error}=await sb.rpc("create_shop_purchase",{p_supplier_id:null,p_currency:"LAK",p_exchange_rate:1,p_paid_amount:Number($("bpaid").value||0),p_note:$("bn").value.trim()+" "+$("bnote").value.trim(),p_items:purchaseCart.map(x=>({product_id:x.product_id,qty:x.qty,unit_cost:x.unit_cost}))});if(error){alert(error.message);return}alert("ຮັບສິນຄ້າແລ້ວ: "+data.purchase_no);purchaseCart=[];await purchasesPage()}
async function listPurchases(){const {data,error}=await sb.from("purchases").select("*").order("created_at",{ascending:false}).limit(30);if(error){blist.textContent=error.message;return}blist.innerHTML='<div class="tablewrap"><table class="table"><thead><tr><th>ເລກທີ</th><th>ວັນທີ</th><th>ລວມ</th><th>ຄ້າງຈ່າຍ</th></tr></thead><tbody>'+data.map(x=>'<tr><td>'+esc(x.purchase_no)+'</td><td>'+esc(x.purchase_date)+'</td><td>'+money(x.total)+' ₭</td><td>'+money(x.balance_due)+' ₭</td></tr>').join("")+'</tbody></table></div>'}
async function expensesPage(){const es=await q("expenses",{order:"expense_date",asc:false});main.innerHTML='<div class="between"><h1>💵 ລາຍຈ່າຍ</h1><button class="btn" onclick="expenseModal()">➕ ເພີ່ມ</button></div><div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>ວັນທີ</th><th>ລາຍການ</th><th>ໝວດ</th><th>ຈຳນວນ</th><th></th></tr></thead><tbody>'+es.map(e=>'<tr><td>'+esc(e.expense_date)+'</td><td>'+esc(e.title)+'</td><td>'+esc(e.category||"-")+'</td><td>'+money(e.amount)+' ₭</td><td><button class="btn danger" onclick="deleteExpense(\''+e.id+'\')">ລຶບ</button></td></tr>').join("")+'</tbody></table></div></div>'}
function expenseModal(){root.insertAdjacentHTML("beforeend",'<div class="modal" id="modal"><div class="modalbox"><h2>ເພີ່ມລາຍຈ່າຍ</h2><div class="grid g2"><div class="field"><label>ວັນທີ</label><input id="ed" type="date" value="'+dateToday()+'"></div><div class="field"><label>ຈຳນວນເງິນ</label><input id="ea" type="number" min="0"></div><div class="field"><label>ລາຍການ</label><input id="et"></div><div class="field"><label>ໝວດ</label><input id="ec" placeholder="ຄ່າໄຟ, ຄ່າແຮງງານ"></div></div><button class="btn" style="margin-top:12px;width:100%" onclick="saveExpense()">ບັນທຶກ</button></div></div>'}
async function saveExpense(){const r=await sb.from("expenses").insert({expense_date:$("ed").value,title:$("et").value.trim(),category:$("ec").value.trim()||"ທົ່ວໄປ",amount:Number($("ea").value||0),created_by:user.id});if(r.error)alert(r.error.message);else{closeModal();expensesPage()}}
async function deleteExpense(id){if(confirm("ລຶບລາຍຈ່າຍ?")){const r=await sb.from("expenses").delete().eq("id",id);if(r.error)alert(r.error.message);else expensesPage()}}
async function reportsPage(){const ss=await q("sales",{order:"created_at",asc:false}),es=await q("expenses",{order:"expense_date",asc:false});const total=ss.reduce((a,x)=>a+Number(x.total||0),0),profit=ss.reduce((a,x)=>a+Number(x.profit||0),0),expense=es.reduce((a,x)=>a+Number(x.amount||0),0);main.innerHTML='<h1>📈 ລາຍງານ</h1><div class="grid g3"><div class="card">ຍອດຂາຍລວມ<div class="stat">'+money(total)+' ₭</div></div><div class="card">ກຳໄລຂັ້ນຕົ້ນ<div class="stat">'+money(profit)+' ₭</div></div><div class="card">ຄ່າໃຊ້ຈ່າຍ<div class="stat">'+money(expense)+' ₭</div></div></div><div class="card" style="margin-top:14px"><h2>ລາຍການຂາຍ</h2><div class="tablewrap"><table class="table"><thead><tr><th>ເລກບິນ</th><th>ວັນທີ</th><th>ຍອດຂາຍ</th><th>ກຳໄລ</th><th>ຮັບແລ້ວ</th><th>ຄ້າງ</th></tr></thead><tbody>'+ss.map(s=>'<tr><td>'+esc(s.receipt_no)+'</td><td>'+esc(s.sale_date)+'</td><td>'+money(s.total)+' '+(s.currency==="THB"?"฿":"₭")+'</td><td>'+money(s.profit)+'</td><td>'+money(s.paid_amount)+'</td><td>'+money(s.balance_due)+'</td></tr>').join("")+'</tbody></table></div></div>'}
async function resetPassword(){const {error}=await sb.auth.resetPasswordForEmail(user.email,{redirectTo:location.origin});alert(error?error.message:"ສົ່ງລິ້ງຕັ້ງລະຫັດໃໝ່ໄປທີ່ອີເມວແລ້ວ")}
boot();
</script></body></html>
