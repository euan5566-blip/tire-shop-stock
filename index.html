ign-items:center;gap:8px;flex-wrap:wrap}.between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:11px;margin-top:12px}.table{border-collapse:collapse;width:100%;min-width:650px}.table th,.table td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.table th{background:#f7f9fc;color:#53677b;font-size:13px}.pill{display:inline-block;background:#e7eef6;padding:4px 9px;border-radius:20px;font-size:12px}.low{background:#fee4e2;color:#a11b12}.notice{background:#fff4e5;color:#8a4b08;padding:11px;border-radius:9px;margin:10px 0}.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:15px;z-index:20}.modalbox{background:white;border-radius:15px;width:min(800px,100%);max-height:92vh;overflow:auto;padding:20px}.login{min-height:100vh;display:grid;place-items:center;padding:18px}.loginbox{width:min(430px,100%)}.cartrow{display:grid;grid-template-columns:1fr 75px 100px 35px;gap:8px;align-items:center;margin:8px 0}.cartrow input{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px}.toast{position:fixed;bottom:20px;right:20px;background:#122a40;color:white;padding:12px 16px;border-radius:10px;z-index:50}

</style></head><body><div id="root"></div><script>
const SUPABASE_URL='https://zslnuhaeutdsaeghhmxl.supabase.co',SUPABASE_KEY='sb_publishable_Wng9wm2-7HtnFj_0gEOvvg_BAVhuUr0';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])),num=v=>Number(v||0),fmt=v=>num(v).toLocaleString('lo-LA',{maximumFractionDigits:2});
let user=null,page='dashboard',products=[],customers=[],vehicles=[],profiles=[],shop={name:'ຮ້ານຢາງ & ອູ່ລົດ',phone:'',address:''},rates={THB:667,USD:.0296},cart=[],currency='LAK';
const pages={dashboard:'ພາບລວມ',repair:'ວຽກສ້ອມລົດ',pos:'ຂາຍໜ້າຮ້ານ (POS)',products:'ສິນຄ້າ & ສະຕັອກ',customers:'ລູກຄ້າ',vehicles:'ລົດລູກຄ້າ',online:'ຂາຍອອນລາຍ',expenses:'ລາຍຈ່າຍ',reports:'ລາຍງານ',settings:'ຕັ້ງຄ່າ'};
function toast(s){let e=document.createElement('div');e.className='toast';e.textContent=s;document.body.append(e);setTimeout(()=>e.remove(),3000)}
async function sel(t,cols='*'){let r=await sb.from(t).select(cols);if(r.error)throw r.error;return r.data||[]}
async function ins(t,d){let r=await sb.from(t).insert(d).select().single();if(r.error)throw r.error;return r.data}
async function upd(t,id,d){let r=await sb.from(t).update(d).eq('id',id);if(r.error)throw r.error}
function fld(label,id,type='text',value='',attrs=''){return '<div class="field"><label>'+label+'</label><input id="'+id+'" type="'+type+'" value="'+esc(value)+'" '+attrs+'></div>'}
function sfield(label,id,opts,chosen=''){return '<div class="field"><label>'+label+'</label><select id="'+id+'">'+opts.map(o=>'<option value="'+esc(o.value)+'" '+(o.value===chosen?'selected':'')+'>'+esc(o.label)+'</option>').join('')+'</select></div>'}
function head(title,btn=''){return '<div class="heading"><h1>'+title+'</h1>'+btn+'</div>'}
function tbl(h,rows){return '<div class="tablewrap"><table class="table"><thead><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>'}
function nav(){return Object.entries(pages).map(([k,v])=>'<button class="'+(page===k?'active':'')+'" onclick="go(\''+k+'\')">'+({dashboard:'▦',repair:'🔧',pos:'🧾',products:'📦',customers:'👤',vehicles:'🚗',online:'🛍️',reports:'📈',settings:'⚙️'}[k])+' '+v+'</button>').join('')}
function go(p){page=p;render()}
async function render(){let root=$('root');root.innerHTML='<div class="card">ກຳລັງໂຫຼດ...</div>';root.innerHTML='<header class="top"><div class="brand">🛞 '+esc(shop.name)+'</div><div class="row"><span class="hide-mobile">'+esc(user.email||'')+'</span><button class="secondary" onclick="logout()">ອອກຈາກລະບົບ</button></div></header><div class="layout"><aside class="side"><div class="nav">'+nav()+'</div></aside><main class="main" id="main"></main></div>';try{await common();let e=$('main');if(page==='dashboard')await dashboard(e);if(page==='products')await productPage(e);if(page==='customers')await customerPage(e);if(page==='vehicles')await vehiclePage(e);if(page==='repair')await repairPage(e);if(page==='pos')await posPage(e);if(page==='online')await onlinePage(e);if(page==='expenses')await expensePage(e);if(page==='reports')await reportPage(e);if(page==='settings')await settingPage(e)}catch(e){$('main').innerHTML='<div class="notice">ຜິດພາດ: '+esc(e.message||e)+'</div>'}}
async function common(){[products,customers,vehicles,profiles]=await Promise.all([sel('products'),sel('customers'),sel('vehicles'),sel('profiles','id,full_name,role,active')]);let a=await sb.from('app_settings').select('value').eq('key','shop').maybeSingle();if(a.data?.value)shop={...shop,...a.data.value};let rs=await sel('exchange_rates');rs.forEach(r=>{if(r.base_currency==='THB')rates[r.quote_currency]=num(r.rate)})}
const customerOpts=()=>customers.map(c=>({value:c.id,label:c.name+(c.phone?' • '+c.phone:'')})),vehicleOpts=()=>vehicles.map(v=>({value:v.id,label:v.plate+' • '+v.brand+' '+v.model})),staffOpts=()=>profiles.filter(p=>p.active).map(p=>({value:p.id,label:p.full_name+' ('+p.role+')'})),productOpts=()=>products.filter(p=>p.active).map(p=>({value:p.id,label:p.name+' ('+fmt(p.stock_on_hand)+' ຄົງເຫຼືອ)'}));
async function dashboard(e){let [sales,ros]=await Promise.all([sel('sales','total,sale_date,status,currency'),sel('repair_orders','id,status')]);let d=new Date().toISOString().slice(0,10),today=sales.filter(s=>s.sale_date===d&&s.status==='completed'),byCur={};today.forEach(s=>{let cur=s.currency||'LAK';byCur[cur]=(byCur[cur]||0)+num(s.total)});let revenueHtml=Object.keys(byCur).length?Object.entries(byCur).map(([cur,val])=>'<div class="stat">'+fmt(val)+' '+esc(cur)+'</div>').join(''):'<div class="stat">0 LAK</div>',open=ros.filter(r=>!['delivered','cancelled'].includes(r.status)).length,low=products.filter(p=>p.active&&num(p.stock_on_hand)<=num(p.min_stock)).length;e.innerHTML=head(pages.dashboard)+'<div class="grid g4"><div class="card"><div class="muted">ຍອດຂາຍມື້ນີ້ (ແຍກຕາມສະກຸນເງິນ)</div>'+revenueHtml+'</div><div class="card"><div class="muted">ວຽກສ້ອມທີ່ຍັງເປີດ</div><div class="stat">'+open+'</div></div><div class="card"><div class="muted">ສິນຄ້າໃກ້ໝົດ / ໝົດ</div><div class="stat">'+low+'</div></div><div class="card"><div class="muted">ລູກຄ້າ</div><div class="stat">'+customers.length+'</div></div></div><div class="card" style="margin-top:14px"><h2>ສິນຄ້າຕ້ອງສັ່ງເພີ່ມ</h2>'+tbl(['ສິນຄ້າ','ບາໂຄດ','ຄົງເຫຼືອ','ຂັ້ນຕ່ຳ'],products.filter(p=>p.active&&num(p.stock_on_hand)<=num(p.min_stock)).map(p=>'<tr><td>'+esc(p.name)+'</td><td>'+esc(p.barcode||'—')+'</td><td><span class="pill low">'+fmt(p.stock_on_hand)+'</span></td><td>'+fmt(p.min_stock)+'</td></tr>'))+'</div>'}
async function productPage(e){e.innerHTML=head(pages.products,'<button onclick="productForm()">＋ ເພີ່ມສິນຄ້າ</button>')+'<div class="card"><input id="ps" placeholder="ຄົ້ນຫາຊື່ / ບາໂຄດ / ຂະໜາດ" oninput="filterP()" style="width:100%;padding:11px;border:1px solid var(--line);border-radius:9px">'+tbl(['ສິນຄ້າ','ບາໂຄດ','ທຶນ LAK','ຂາຍ LAK','ຄົງເຫຼືອ','ຂັ້ນຕ່ຳ','ຈັດການ'],products.map(prodRow))+'</div>'}
function prodRow(p){return '<tr><td>'+(p.image_url?'<img src="'+esc(p.image_url)+'" style="width:48px;height:42px;object-fit:contain;vertical-align:middle;margin-right:8px">':'')+esc(p.name)+'</td><td>'+esc(p.barcode||'—')+'</td><td>'+fmt(baseCost(p))+' LAK</td><td>'+fmt(basePrice(p))+' LAK</td><td><span class="pill '+(num(p.stock_on_hand)<=num(p.min_stock)?'low':'')+'">'+fmt(p.stock_on_hand)+'</span></td><td>'+fmt(p.min_stock)+'</td><td><button class="secondary" onclick="productForm(\''+p.id+'\')">ແກ້ໄຂ</button> <button class="secondary" onclick="stockForm(\''+p.id+'\')">＋ ຮັບເຂົ້າ</button></td></tr>'}
function filterP(){let s=$('ps').value.toLowerCase();$('main').querySelector('tbody').innerHTML=products.filter(p=>(p.name+' '+p.barcode+' '+p.size).toLowerCase().includes(s)).map(prodRow).join('')}
function productForm(id=''){let p=products.find(x=>x.id===id)||{};modal('ຂໍ້ມູນສິນຄ້າ','<div class="formgrid">'+fld('ຊື່ສິນຄ້າ *','pn','text',p.name||'')+fld('ບາໂຄດ','pb','text',p.barcode||'')+fld('ປະເພດ','pc','text',p.category||'')+fld('ຍີ່ຫໍ້','pbrand','text',p.brand||'')+fld('ຂະໜາດ / ລຸ້ນ','psize','text',p.size||'')+fld('ຫົວໜ່ວຍ','punit','text',p.unit||'ອັນ')+fld('ຕົ້ນທຶນ (THB)','pct','number',p.cost_thb||0)+fld('ລາຄາຂາຍ (THB)','ppt','number',p.price_thb||0)+fld('ຈຳນວນສະຕັອກ','pstock','number',p.stock_on_hand||0)+fld('ເຕືອນເມື່ອຕ່ຳກວ່າ','pmin','number',p.min_stock||0)+'</div><div class="field" style="margin-top:12px"><label>ຮູບສິນຄ້າ (JPG, PNG, WebP ບໍ່ເກີນ 5MB)</label><input id="pimage" type="file" accept="image/jpeg,image/png,image/webp" onchange="previewProductImage()"></div><div id="pimagepreview" style="margin-top:8px">'+(p.image_url?'<img src="'+esc(p.image_url)+'" style="max-width:180px;max-height:140px;object-fit:contain;border-radius:8px">':'')+'</div><div class="row" style="margin-top:14px"><button onclick="saveProduct(\''+id+'\')">ບັນທຶກ</button><button class="secondary" onclick="closeModal()">ຍົກເລີກ</button></div>')}
function previewProductImage(){let f=$('pimage')?.files?.[0],e=$('pimagepreview');if(!e)return;if(!f){e.innerHTML='';return}if(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>5242880){toast('ຮູບຕ້ອງເປັນ JPG, PNG ຫຼື WebP ແລະ ບໍ່ເກີນ 5MB');$('pimage').value='';e.innerHTML='';return}e.innerHTML='<img src="'+URL.createObjectURL(f)+'" style="max-width:180px;max-height:140px;object-fit:contain;border-radius:8px">'}async function saveProduct(id){let d={name:$('pn').value.trim(),barcode:$('pb').value.trim()||null,category:$('pc').value,brand:$('pbrand').value,size:$('psize').value,unit:$('punit').value,cost_thb:num($('pct').value),price_thb:num($('ppt').value),stock_on_hand:num($('pstock').value),min_stock:num($('pmin').value),active:true};try{let img=$('pimage')?.files?.[0],oldp=products.find(x=>x.id===id);if(oldp?.image_url)d.image_url=oldp.image_url;if(img){if(!['image/jpeg','image/png','image/webp'].includes(img.type)||img.size>5242880)throw Error('ຮູບຕ້ອງເປັນ JPG, PNG ຫຼື WebP ແລະ ບໍ່ເກີນ 5MB');let ext=img.type==='image/png'?'png':img.type==='image/webp'?'webp':'jpg',path=(id||crypto.randomUUID())+'/'+Date.now()+'.'+ext;let up=await sb.storage.from('product-images').upload(path,img,{contentType:img.type,upsert:true});if(up.error)throw up.error;d.image_url=sb.storage.from('product-images').getPublicUrl(path).data.publicUrl}if(id){let old=products.find(p=>p.id===id);await upd('products',id,d);let diff=d.stock_on_hand-num(old.stock_on_hand);if(diff)await ins('stock_movements',{product_id:id,movement_type:diff>0?'adjustment_in':'adjustment_out',qty:Math.abs(diff),stock_before:old.stock_on_hand,stock_after:d.stock_on_hand,note:'ປັບສະຕັອກ',created_by:user.id})}else await ins('products',d);closeModal();toast('ບັນທຶກສິນຄ້າແລ້ວ');render()}catch(x){toast(x.message)}}
function stockForm(id){let p=products.find(x=>x.id===id);modal('ຮັບເຂົ້າສະຕັອກ: '+p.name,fld('ຈຳນວນ','sq','number',1,'min="0.001" step="0.001"')+fld('ໝາຍເຫດ','snote','text','ຮັບເຂົ້າສາງ')+'<div class="row" style="margin-top:12px"><button onclick="saveStock(\''+id+'\')">ບັນທຶກ</button><button class="secondary" onclick="closeModal()">ປິດ</button></div>')}
async function saveStock(id){let p=products.find(x=>x.id===id),qty=num($('sq').value),after=num(p.stock_on_hand)+qty;try{await upd('products',id,{stock_on_hand:after});await ins('stock_movements',{product_id:id,movement_type:'purchase_in',qty,stock_before:p.stock_on_hand,stock_after:after,note:$('snote').value,created_by:user.id});closeModal();render()}catch(x){toast(x.message)}}
async function customerPage(e){let ss=await sel('sales','id,sale_no,customer_id,total,paid_amount,balance_due,currency,sale_date');let ds=ss.filter(s=>num(s.balance_due)>0&&s.customer_id);e.innerHTML=head(pages.customers,'<button onclick="customerForm()">＋ ເພີ່ມລູກຄ້າ</button>')+'<div class="card">'+tbl(['ຊື່ລູກຄ້າ','ເບີໂທ','ທີ່ຢູ່','ລົດ','ຈັດການ'],customers.map(c=>'<tr><td>'+esc(c.name)+'</td><td>'+esc(c.phone||'—')+'</td><td>'+esc(c.address||'—')+'</td><td>'+vehicles.filter(v=>v.customer_id===c.id).length+'</td><td><button class="secondary" onclick="customerForm(\''+c.id+'\')">ແກ້ໄຂ</button> <button class="secondary" onclick="deleteCustomer(\''+c.id+'\')">ລົບ</button></td></tr>'))+'</div><div class="card" style="margin-top:14px"><h2>ລາຍການຄ້າງຈ່າຍ</h2>'+tbl(['ເລກບິນ','ລູກຄ້າ','ວັນທີ','ຍອດຂາຍ','ຈ່າຍແລ້ວ','ຍັງຄ້າງ','ຈັດການ'],ds.map(s=>'<tr><td>'+esc(s.sale_no||s.id)+'</td><td>'+esc(customers.find(c=>c.id===s.customer_id)?.name||'')+'</td><td>'+esc(s.sale_date||'')+'</td><td>'+fmt(s.total)+' '+esc(s.currency)+'</td><td>'+fmt(s.paid_amount)+' '+esc(s.currency)+'</td><td><b>'+fmt(s.balance_due)+' '+esc(s.currency)+'</b></td><td><button onclick="receiveDebt(\''+s.id+'\')">ຮັບຊຳລະ</button></td></tr>'))+'</div>'}
function receiveDebt(id){sel('sales','id,sale_no,total,paid_amount,balance_due,currency').then(rows=>{let s=rows.find(x=>x.id===id);if(!s)return;modal('ຮັບຊຳລະ '+(s.sale_no||''),fld('ຈຳນວນຮັບ ('+s.currency+')','payamt','number',s.balance_due,'min="0.01" max="'+s.balance_due+'" step="0.01"')+'<div class="row" style="margin-top:12px"><button onclick="saveDebt(\''+id+'\')">ບັນທຶກຮັບເງິນ</button><button class="secondary" onclick="closeModal()">ປິດ</button></div>')})}async function saveDebt(id){try{let ss=await sel('sales','id,total,paid_amount,balance_due,currency'),s=ss.find(x=>x.id===id),a=num($('payamt').value);if(!s||a<=0||a>num(s.balance_due))throw Error('ຈຳນວນຮັບບໍ່ຖືກ');await ins('sale_payments',{sale_id:id,amount:a,currency:s.currency,payment_method:'cash',received_by:user.id});await upd('sales',id,{paid_amount:num(s.paid_amount)+a,balance_due:num(s.balance_due)-a});closeModal();toast('ຮັບຊຳລະແລ້ວ');render()}catch(x){toast(x.message||x)}}function customerForm(id=''){let c=customers.find(x=>x.id===id)||{};modal(id?'ແກ້ໄຂລູກຄ້າ':'ເພີ່ມລູກຄ້າ','<div class="formgrid">'+fld('ຊື່ *','cn','text',c.name||'')+fld('ເບີໂທ','ct','text',c.phone||'')+fld('ອີເມວ','ce','email',c.email||'')+fld('ທີ່ຢູ່','ca','text',c.address||'')+'</div><div class="row" style="margin-top:12px"><button onclick="saveCustomer(\''+id+'\')">ບັນທຶກ</button><button class="secondary" onclick="closeModal()">ປິດ</button></div>')}
async function saveCustomer(id=''){try{let d={name:$('cn').value.trim(),phone:$('ct').value.trim(),address:$('ca').value.trim(),email:$('ce').value.trim()};if(!d.name)throw Error('ກະລຸນາໃສ່ຊື່ລູກຄ້າ');if(id)await upd('customers',id,d);else await ins('customers',d);closeModal();toast('ບັນທຶກລູກຄ້າສຳເລັດ');render()}catch(x){toast(x.message||x)}}
async function deleteCustomer(id){if(!confirm('ຢືນຢັນລົບລູກຄ້າ? ຖ້າມີລົດ/ປະຫວັດຜູກຢູ່ ຈະບໍ່ລົບ.'))return;try{let [vs,rs,ss]=await Promise.all([sb.from('vehicles').select('id').eq('customer_id',id),sb.from('repair_orders').select('id').eq('customer_id',id),sb.from('sales').select('id').eq('customer_id',id)]);if(vs.data?.length||rs.data?.length||ss.data?.length)throw Error('ລູກຄ້າມີລົດ ຫຼື ປະຫວັດຂາຍ/ສ້ອມ ຈຶ່ງລົບບໍ່ໄດ້. ໃຫ້ແກ້ໄຂຂໍ້ມູນແທນ.');let r=await sb.from('customers').delete().eq('id',id);if(r.error)throw r.error;toast('ລົບສຳເລັດ');render()}catch(x){toast(x.message||x)}}
async function vehiclePage(e){e.innerHTML=head(pages.vehicles,'<button onclick="vehicleForm()">＋ ເພີ່ມລົດ</button>')+'<div class="card">'+tbl(['ທະບຽນ','ຍີ່ຫໍ້ / ລຸ້ນ','ສີ','VIN','ເຈົ້າຂອງ','ຈັດການ'],vehicles.map(v=>'<tr><td><b>'+esc(v.plate)+'</b></td><td>'+esc((v.brand||'')+' '+(v.model||''))+'</td><td>'+esc(v.color||'—')+'</td><td>'+esc(v.vin||'—')+'</td><td>'+esc(customers.find(c=>c.id===v.customer_id)?.name||'')+'</td><td><button class="secondary" onclick="vehicleForm(\''+v.id+'\')">ແກ້ໄຂ</button> <button class="secondary" onclick="deleteVehicle(\''+v.id+'\')">ລົບ</button></td></tr>'))+'</div>'}
function vehicleForm(id=''){let v=vehicles.find(x=>x.id===id)||{};modal(id?'ແກ້ໄຂຂໍ້ມູນລົດ':'ເພີ່ມລົດ','<div class="formgrid">'+sfield('ເຈົ້າຂອງ *','vc',customerOpts(),v.customer_id||'')+fld('ທະບຽນ *','vp','text',v.plate||'')+fld('VIN','vvin','text',v.vin||'')+fld('ຍີ່ຫໍ້','vb','text',v.brand||'')+fld('ລຸ້ນ','vm','text',v.model||'')+fld('ປີ','vy','number',v.year||'')+fld('ສີ','vcolor','text',v.color||'')+fld('ເລກເຄື່ອງ','ve','text',v.engine_no||'')+'</div><div class="row" style="margin-top:12px"><button onclick="saveVehicle(\''+id+'\')">ບັນທຶກ</button><button class="secondary" onclick="closeModal()">ປິດ</button></div>')}
async function saveVehicle(id=''){try{let d={customer_id:$('vc').value,plate:$('vp').value.trim(),vin:$('vvin').value.trim(),brand:$('vb').value.trim(),model:$('vm').value.trim(),year:num($('vy').value)||null,color:$('vcolor').value.trim(),engine_no:$('ve').value.trim()};if(!d.customer_id||!d.plate)throw Error('ກະລຸນາເລືອກເຈົ້າຂອງ ແລະ ໃສ່ທະບຽນ');if(id)await upd('vehicles',id,d);else await ins('vehicles',d);closeModal();toast('ບັນທຶກຂໍ້ມູນລົດສຳເລັດ');render()}catch(x){toast(x.message||x)}}
async function deleteVehicle(id){if(!confirm('ຢືນຢັນລົບລົດ? ລົດທີ່ມີປະຫວັດສ້ອມຈະລົບບໍ່ໄດ້.'))return;try{let r=await sb.from('repair_orders').select('id').eq('vehicle_id',id);if(r.data?.length)throw Error('ລົດຄັນນີ້ມີປະຫວັດສ້ອມ ຈຶ່ງລົບບໍ່ໄດ້.');let d=await sb.from('vehicles').delete().eq('id',id);if(d.error)throw d.error;toast('ລົບສຳເລັດ');render()}catch(x){toast(x.message||x)}}
async function repairPage(e){let ros=await sel('repair_orders');ros.sort((a,b)=>new Date(b.opened_at)-new Date(a.opened_at));let states=['open','diagnosing','waiting_parts','in_progress','ready','delivered','cancelled'];let rows=ros.map(r=>'<tr><td><b>'+esc(r.ro_no)+'</b></td><td>'+esc(customers.find(c=>c.id===r.customer_id)?.name||'')+'</td><td>'+esc(vehicles.find(v=>v.id===r.vehicle_id)?.plate||'')+'</td><td>'+esc(r.complaint)+'</td><td>'+esc(r.work_type)+'</td><td><select onchange="changeRO(&quot;'+r.id+'&quot;,this.value)">'+states.map(s=>'<option value="'+s+'" '+(s===r.status?'selected':'')+'>'+s+'</option>').join('')+'</select></td><td>'+new Date(r.opened_at).toLocaleDateString('lo-LA')+'</td><td><button class="secondary" onclick="roItems(&quot;'+r.id+'&quot;)">＋ ລາຍການ</button> <button class="secondary" onclick="roPay(&quot;'+r.id+'&quot;)">ຮັບເງິນ</button></td></tr>');e.innerHTML=head(pages.repair,'<button onclick="repairForm()">＋ ເປີດໃບສ້ອມ</button>')+'<div class="card">'+tbl(['ເລກ RO','ລູກຄ້າ','ລົດ','ອາການ','ປະເພດ','ສະຖານະ','ວັນທີ','ຈັດການ'],rows)+'</div>'}
function repairForm(){modal('ເປີດໃບສ້ອມ (Repair Order)','<div class="formgrid">'+sfield('ລູກຄ້າ *','rc',customerOpts())+sfield('ລົດ *','rv',vehicleOpts())+sfield('ຊ່າງຜູ້ຮັບຜິດຊອບ','ra',staffOpts())+sfield('ປະເພດວຽກ','rt',['ປ່ຽນຢາງ','ບໍລິການລໍ້','ສ້ອມຊ່ວງລ່າງ','ສ້ອມເຄື່ອງ','ສ້ອມເກຍ','ສ້ອມທົ່ວໄປ'].map(x=>({value:x,label:x})))+'<div class="field wide"><label>ອາການທີ່ລູກຄ້າແຈ້ງ *</label><textarea id="rcomp"></textarea></div><div class="field wide"><label>ການກວດພົບ / ໝາຍເຫດ</label><textarea id="rdiag"></textarea></div></div><div class="row" style="margin-top:12px"><button onclick="saveRO()">ສ້າງໃບສ້ອມ</button><button class="secondary" onclick="closeModal()">ປິດ</button></div>')}
async function saveRO(){try{await ins('repair_orders',{customer_id:$('rc').value,vehicle_id:$('rv').value,assigned_to:$('ra').value||null,work_type:$('rt').value,complaint:$('rcomp').value,diagnosis:$('rdiag').value,status:'open',created_by:user.id});closeModal();toast('ສ້າງໃບສ້ອມແລ້ວ');render()}catch(x){toast(x.message)}}
async function changeRO(id,status){try{await upd('repair_orders',id,{status,completed_at:status==='delivered'?new Date().toISOString():null});toast('ປ່ຽນສະຖານະແລ້ວ')}catch(x){toast(x.message)}}
function roItems(id){modal('ເພີ່ມອະໄຫຼ່ / ຄ່າແຮງ','<div class="formgrid">'+sfield('ປະເພດ','rit',[{value:'part',label:'ອະໄຫຼ່'},{value:'labor',label:'ຄ່າແຮງ'},{value:'service',label:'ບໍລິການ'}])+sfield('ເລືອກອະໄຫຼ່','rip',productOpts())+fld('ລາຍລະອຽດ','rid')+fld('ຈຳນວນ','riq','number',1)+fld('ລາຄາຕໍ່ໜ່ວຍ (LAK)','riu','number',0)+'</div><div class="row" style="margin-top:12px"><button onclick="saveROItem(\''+id+'\')">ບັນທຶກ</button><button class="secondary" onclick="closeModal()">ປິດ</button></div>')}
async function saveROItem(id){try{let ro=(await sel('repair_orders')).find(x=>x.id===id),type=$('rit').value,prod=products.find(x=>x.id===$('rip').value),qty=num($('riq').value),price=num($('riu').value),desc=$('rid').value||(prod?.name)||type,total=qty*price;if(type==='part'&&prod){if(num(prod.stock_on_hand)<qty)throw Error('ສະຕັອກອະໄຫຼ່ບໍ່ພໍ');let after=num(prod.stock_on_hand)-qty;await upd('products',prod.id,{stock_on_hand:after});await ins('stock_movements',{product_id:prod.id,movement_type:'repair_issue',qty,stock_before:prod.stock_on_hand,stock_after:after,ref_table:'repair_orders',ref_id:id,created_by:user.id})}await ins('repair_order_items',{repair_order_id:id,line_type:type,product_id:type==='part'&&prod?prod.id:null,description:desc,qty,unit_cost:prod?num(prod.cost_lak):0,unit_price:price,line_total:total,stock_issued:type==='part'&&!!prod});let parts=num(ro.parts_total)+(type==='part'?total:0),labor=num(ro.labor_total)+(type!=='part'?total:0);await upd('repair_orders',id,{parts_total:parts,labor_total:labor,total:parts+labor-num(ro.discount),balance_due:parts+labor-num(ro.discount)-num(ro.paid_amount)});closeModal();toast('ເພີ່ມລາຍການແລ້ວ');render()}catch(x){toast(x.message)}}
function roPay(id){modal('ຮັບຊຳລະຄ່າສ້ອມ','<div class="formgrid">'+fld('ຈຳນວນເງິນ (LAK)','rpay','number',0)+sfield('ວິທີຈ່າຍ','rpm',[{value:'cash',label:'ເງິນສົດ'},{value:'transfer',label:'ໂອນ'},{value:'mixed',label:'ປະສົມ'}])+'</div><div class="row" style="margin-top:12px"><button onclick="saveROPay(\''+id+'\')">ບັນທຶກ</button><button class="secondary" onclick="closeModal()">ປິດ</button></div>')}
async function saveROPay(id){try{let ro=(await sel('repair_orders')).find(x=>x.id===id),amount=num($('rpay').value);if(amount<=0)throw Error('ໃສ່ຈຳນວນເງິນ');await ins('repair_order_payments',{repair_order_id:id,amount,currency:'LAK',payment_method:$('rpm').value,received_by:user.id});await upd('repair_orders',id,{paid_amount:num(ro.paid_amount)+amount,balance_due:Math.max(0,num(ro.total)-num(ro.paid_amount)-amount)});closeModal();toast('ຮັບຊຳລະແລ້ວ');render()}catch(x){toast(x.message)}}
function lakPerCurrency(cur=currency){if(cur==='LAK')return 1;let r=num(rates[cur]);return r>0?1/r:0}
function basePrice(p){let v=num(p.price_thb);if(v>0&&num(rates.THB)>0)return v;let legacy=num(p.price_lak);return legacy>0?legacy:0}
function baseCost(p){let v=num(p.cost_thb);return v}
function getPrice(p){let rate=lakPerCurrency(currency);return currency==='LAK'?basePrice(p)*num(rates.THB):currency==='USD'?basePrice(p)*num(rates.USD):basePrice(p)}
async function posPage(e){e.innerHTML=head(pages.pos)+'<div class="grid g2"><div class="card"><h2>ເລືອກສິນຄ້າ</h2><div class="field"><label>ຄົ້ນຫາ / ສະແກນບາໂຄດ</label><input id="posq" placeholder="ພິມຊື່ ຫຼື ບາໂຄດ" oninput="posSearch()"></div><div id="posresults"></div></div><div class="card"><h2>ລາຍການຂາຍ</h2>'+sfield('ລູກຄ້າ','poscustomer',[{value:'',label:'ລູກຄ້າທົ່ວໄປ'},...customerOpts()])+sfield('ສະກຸນເງິນ','poscur',['LAK','THB','USD'].map(c=>({value:c,label:c})),currency)+'<div id="cartlist"></div><div class="between" style="margin-top:12px"><b>ລວມ</b><span class="stat" id="ctotal">0</span></div><div class="formgrid" style="margin-top:10px">'+sfield('ວິທີຈ່າຍ','pm',[{value:'cash',label:'ເງິນສົດ'},{value:'transfer',label:'ໂອນ'},{value:'mixed',label:'ຈ່າຍປະສົມ'},{value:'cod',label:'COD'}])+fld('ຮັບເງິນ','paid','number',0,'oninput="updateChange()"')+fld('ເງິນທອນ','change','text',0,'readonly')+'</div><button style="width:100%;margin-top:12px" onclick="checkout()">ຢືນຢັນການຂາຍ</button></div></div>';currency=$('poscur').value;$('poscur').onchange=()=>{currency=$('poscur').value;cart=[];updateCart();posSearch()};posSearch();updateCart()}
function posSearch(){if(!$('posq'))return;let s=$('posq').value.toLowerCase(),found=products.filter(p=>p.active&&num(p.stock_on_hand)>0&&(p.name+' '+p.barcode+' '+p.size).toLowerCase().includes(s)).slice(0,15);$('posresults').innerHTML=found.map(p=>'<div class="between" style="padding:8px 0;border-bottom:1px solid var(--line)"><div><b>'+esc(p.name)+'</b><div class="muted">'+esc(p.barcode||'')+' • '+fmt(p.stock_on_hand)+' ຄົງເຫຼືອ</div></div><button onclick="addCart(\''+p.id+'\')">'+fmt(getPrice(p))+' '+currency+' ＋</button></div>').join('')||'<p class="muted">ບໍ່ພົບສິນຄ້າ</p>'}
function addCart(id){let p=products.find(x=>x.id===id),i=cart.find(x=>x.id===id);if(i)i.qty++;else cart.push({id,name:p.name,qty:1,price:getPrice(p),cost:(currency==='LAK'?baseCost(p)*num(rates.THB):currency==='USD'?baseCost(p)*num(rates.USD):baseCost(p))});updateCart()}
function updateChange(){let total=cart.reduce((a,x)=>a+x.price*x.qty,0),paid=num($('paid')?.value);if($('change'))$('change').value=fmt(Math.max(0,paid-total))}function updateCart(){let total=cart.reduce((a,x)=>a+x.price*x.qty,0);if($('cartlist')){$('cartlist').innerHTML=cart.map((x,i)=>'<div class="cartrow"><span>'+esc(x.name)+'</span><input type="number" min="1" value="'+x.qty+'" onchange="cartQty('+i+',this.value)"><b>'+fmt(x.qty*x.price)+'</b><button class="secondary" onclick="cart.splice('+i+',1);updateCart()">×</button></div>').join('');$('ctotal').textContent=fmt(total)+' '+currency;updateChange()}}
function cartQty(i,v){cart[i].qty=Math.max(1,num(v));updateCart()}
async function checkout(){if(!cart.length)return toast('ເລືອກສິນຄ້າກ່ອນ');let total=cart.reduce((a,x)=>a+x.price*x.qty,0),paid=num($('paid').value),method=$('pm').value;if(paid>total)return toast('ຈຳນວນເງິນຮັບເກີນຍອດຂາຍ');try{for(let x of cart){let p=products.find(z=>z.id===x.id);if(num(p.stock_on_hand)<x.qty)throw Error('ສະຕັອກບໍ່ພໍ: '+p.name)}let sale=await ins('sales',{channel:'counter',status:'completed',currency,exchange_rate:currency==='THB'?1:currency==='LAK'?num(rates.THB):num(rates.USD),subtotal:total,total,paid_amount:paid,balance_due:Math.max(0,total-paid),payment_method:method,customer_id:$('poscustomer')?.value||null,sold_by:user.id});for(let x of cart){let p=products.find(z=>z.id===x.id),after=num(p.stock_on_hand)-x.qty;await ins('sale_items',{sale_id:sale.id,product_id:p.id,description:p.name,qty:x.qty,unit_cost:x.cost,unit_price:x.price,line_total:x.qty*x.price});await upd('products',p.id,{stock_on_hand:after});await ins('stock_movements',{product_id:p.id,movement_type:'sale_out',qty:x.qty,stock_before:p.stock_on_hand,stock_after:after,ref_table:'sales',ref_id:sale.id,created_by:user.id})}if(paid>0)await ins('sale_payments',{sale_id:sale.id,amount:paid,currency,payment_method:method,received_by:user.id});cart=[];toast('ບັນທຶກ '+sale.sale_no+' ສຳເລັດ');await render();printReceipt(sale)}catch(x){toast('ບັນທຶກບໍ່ສຳເລັດ: '+x.message)}}
async function printReceipt(s){let items=(await sel('sale_items')).filter(x=>x.sale_id===s.id),w=window.open('','_blank');if(!w)return toast('ອະນຸຍາດໜ້າຕ່າງພິມ');w.document.write('<html><head><title>ໃບບິນ</title><style>@page{size:A4;margin:15mm}body{font:16px Arial;padding:20px}</style></head><body><h2>'+esc(shop.name)+'</h2><p>'+esc(shop.address)+' • '+esc(shop.phone)+'</p><h3>ໃບບິນ / RECEIPT</h3><p>'+esc(s.sale_no)+' • '+new Date(s.created_at).toLocaleString('lo-LA')+'</p><hr>'+items.map(x=>'<p>'+esc(x.description)+' × '+x.qty+' = '+fmt(x.line_total)+' '+s.currency+'</p>').join('')+'<hr><h2>ລວມ: '+fmt(s.total)+' '+s.currency+'</h2><p>ຮັບເງິນ: '+fmt(s.paid_amount)+' • ເງິນທອນ: '+fmt(Math.max(0,s.paid_amount-s.total))+'</p></body></html>');w.document.close();w.print()}
async function onlinePage(e){let os=await sel('online_orders');os.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));let states=['new','confirmed','packed','shipped','delivered','rejected','returned','cancelled'];e.innerHTML=head(pages.online,'<button onclick="onlineForm()">＋ ສ້າງອໍເດີ</button>')+'<div class="card">'+tbl(['ເລກອໍເດີ','ລູກຄ້າ','ເບີໂທ','ຍອດ','ວິທີຈ່າຍ','ສະຖານະ','ປັບສະຖານະ'],os.map(o=>'<tr><td>'+esc(o.order_no)+'</td><td>'+esc(o.customer_name)+'</td><td>'+esc(o.customer_phone)+'</td><td>'+fmt(o.total)+' '+o.currency+'</td><td>'+esc(o.payment_method)+'</td><td>'+esc(o.status)+'</td><td><select onchange="changeOnline(\''+o.id+'\',this.value)">'+states.map(s=>'<option value="'+s+'" '+(s===o.status?'selected':'')+'>'+s+'</option>').join('')+'</select></td></tr>'))+'</div>'}
function onlineForm(){modal('ສ້າງອໍເດີອອນລາຍ','<div class="formgrid">'+fld('ຊື່ລູກຄ້າ *','oname')+fld('ເບີໂທ *','ophone')+fld('ທີ່ຢູ່ຈັດສົ່ງ','oaddr')+sfield('ວິທີຈ່າຍ','omethod',[{value:'cod',label:'COD ເກັບປາຍທາງ'},{value:'pay_origin',label:'ຈ່າຍລ່ວງໜ້າ'},{value:'transfer',label:'ໂອນ'}])+sfield('ສະກຸນເງິນ','ocur',['LAK','THB','USD'].map(c=>({value:c,label:c})))+fld('ຍອດລວມ','ototal','number',0)+'</div><div class="row" style="margin-top:12px"><button onclick="saveOnline()">ບັນທຶກ</button><button class="secondary" onclick="closeModal()">ປິດ</button></div>')}
async function saveOnline(){try{let total=num($('ototal').value),method=$('omethod').value;await ins('online_orders',{customer_name:$('oname').value,customer_phone:$('ophone').value,delivery_address:$('oaddr').value,payment_method:method,currency:$('ocur').value,total,subtotal:total,paid_amount:method==='pay_origin'?total:0,created_by:user.id});closeModal();render()}catch(x){toast(x.message)}}
async function changeOnline(id,status){try{await upd('online_orders',id,{status});toast('ອັບເດດອໍເດີແລ້ວ')}catch(x){toast(x.message)}}
async function expensePage(e){let rows=await sel('expenses');rows.sort((a,b)=>new Date(b.expense_date)-new Date(a.expense_date));e.innerHTML=head(pages.expenses,'<button onclick="expenseForm()">＋ ເພີ່ມລາຍຈ່າຍ</button>')+'<div class="card">'+tbl(['ວັນທີ','ລາຍຈ່າຍ','ໝວດ','ຈຳນວນ','ໝາຍເຫດ'],rows.map(x=>'<tr><td>'+esc(x.expense_date)+'</td><td>'+esc(x.title)+'</td><td>'+esc(x.category)+'</td><td>'+fmt(x.amount)+' '+x.currency+'</td><td>'+esc(x.note||'')+'</td></tr>'))+'</div>'}
function expenseForm(){modal('ເພີ່ມລາຍຈ່າຍ','<div class="formgrid">'+fld('ລາຍການ *','et')+fld('ໝວດ','ec','text','ທົ່ວໄປ')+fld('ຈຳນວນ','ea','number',0)+sfield('ສະກຸນເງິນ','eu',['LAK','THB','USD'].map(c=>({value:c,label:c})))+fld('ວັນທີ','ed','date',new Date().toISOString().slice(0,10))+'<div class="field wide"><label>ໝາຍເຫດ</label><input id="en"></div></div><div class="row" style="margin-top:12px"><button onclick="saveExpense()">ບັນທຶກ</button><button class="secondary" onclick="closeModal()">ປິດ</button></div>')}
async function saveExpense(){try{await ins('expenses',{title:$('et').value,category:$('ec').value,amount:num($('ea').value),currency:$('eu').value,expense_date:$('ed').value,note:$('en').value,created_by:user.id});closeModal();render()}catch(x){toast(x.message)}}
let reportSales=[],reportItems=[],reportExpenses=[];
async function reportPage(e){[reportSales,reportItems,reportExpenses]=await Promise.all([sel('sales'),sel('sale_items'),sel('expenses')]);reportSales.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));e.innerHTML=head(pages.reports,'<button onclick="exportCSV()">Export CSV</button>')+'<div class="card"><div class="formgrid">'+fld('ຈາກວັນທີ','rfrom','date','')+fld('ຫາວັນທີ','rto','date','')+fld('ຄົ້ນຫາ ເລກບິນ/ຊ່ອງທາງ','rsearch','text','')+'</div><button style="margin-top:10px" onclick="filterSalesReport()">ຄົ້ນຫາ</button> <button class="secondary" onclick="$(\'rfrom\').value=\'\';$(\'rto\').value=\'\';$(\'rsearch\').value=\'\';filterSalesReport()">ລ້າງຕົວກອງ</button></div><div id="reportSummary" class="grid g3" style="margin-top:14px"></div><div class="card" style="margin-top:14px"><h2>ປະຫວັດການຂາຍ</h2><div id="reportTable"></div></div>';filterSalesReport()}
function filterSalesReport(){let from=$('rfrom')?.value||'',to=$('rto')?.value||'',q=($('rsearch')?.value||'').toLowerCase();let rows=reportSales.filter(s=>(!from||s.sale_date>=from)&&(!to||s.sale_date<=to)&&(!q||((s.sale_no||'')+' '+(s.channel||'')+' '+(s.status||'')).toLowerCase().includes(q)));let done=rows.filter(s=>s.status==='completed'),currencies=[...new Set(done.map(s=>s.currency||'LAK'))];let sums=currencies.map(cur=>{let ss=done.filter(s=>(s.currency||'LAK')===cur),revenue=ss.reduce((a,s)=>a+num(s.total),0),cost=ss.reduce((a,s)=>a+reportItems.filter(i=>i.sale_id===s.id).reduce((b,i)=>b+num(i.unit_cost)*num(i.qty),0),0),exp=reportExpenses.filter(x=>(x.currency||'LAK')===cur&&(!from||x.expense_date>=from)&&(!to||x.expense_date<=to)).reduce((a,x)=>a+num(x.amount),0);return {cur,revenue,cost,exp,profit:revenue-cost-exp}});$('reportSummary').innerHTML=sums.map(x=>'<div class="card"><div class="muted">ຍອດຂາຍ '+x.cur+'</div><div class="stat">'+fmt(x.revenue)+'</div><div class="muted">ທຶນ: '+fmt(x.cost)+' • ລາຍຈ່າຍ: '+fmt(x.exp)+' • ກຳໄລປະເມີນ: '+fmt(x.profit)+'</div></div>').join('')+'<div class="card"><div class="muted">ຈຳນວນບິນ</div><div class="stat">'+rows.length+'</div></div>'; $('reportTable').innerHTML=tbl(['ເລກຂາຍ','ວັນທີ','ຊ່ອງທາງ','ຍອດ','ຮັບແລ້ວ','ຄ້າງຈ່າຍ','ສະຖານະ'],rows.map(s=>'<tr><td>'+esc(s.sale_no)+'</td><td>'+esc(s.sale_date)+'</td><td>'+esc(s.channel)+'</td><td>'+fmt(s.total)+' '+esc(s.currency||'LAK')+'</td><td>'+fmt(s.paid_amount)+'</td><td>'+fmt(s.balance_due)+'</td><td>'+esc(s.status)+'</td></tr>'))}
async function exportCSV(){let rows=await sel('sales'),csv='SaleNo,Date,Channel,Currency,Total,Paid,Status\n'+rows.map(s=>[s.sale_no,s.sale_date,s.channel,s.currency,s.total,s.paid_amount,s.status].join(',')).join('\n'),a=document.createElement('a');a.href=window.URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='sales-report.csv';a.click()}
async function settingPage(e){e.innerHTML=head(pages.settings)+'<div class="card"><h2>ຂໍ້ມູນຮ້ານ</h2><div class="formgrid">'+fld('ຊື່ຮ້ານ','sn','text',shop.name)+fld('ເບີໂທ','sp','text',shop.phone)+fld('ທີ່ຢູ່','sa','text',shop.address)+'</div><h2 style="margin-top:20px">ອັດຕາແລກປ່ຽນ</h2><div class="formgrid">'+fld('1 THB → LAK','rthb','number',rates.THB,'step="0.01"')+fld('1 THB → USD','rusd','number',rates.USD,'step="0.000001"')+'</div><button style="margin-top:14px" onclick="saveSettings()">ບັນທຶກ</button></div><div class="card" style="margin-top:14px"><h2>ຜູ້ໃຊ້</h2>'+tbl(['ຊື່','ບົດບາດ','ສະຖານະ'],profiles.map(p=>'<tr><td>'+esc(p.full_name)+'</td><td>'+esc(p.role)+'</td><td>'+(p.active?'ໃຊ້ງານ':'ປິດ')+'</td></tr>'))+'</div>'}
async function saveSettings(){shop={...shop,name:$('sn').value,phone:$('sp').value,address:$('sa').value};rates.THB=num($('rthb').value);rates.USD=num($('rusd').value);try{let r=await sb.from('app_settings').upsert({key:'shop',value:shop});if(r.error)throw r.error;for(let c of ['THB','USD']){let ex=await sb.from('exchange_rates').select('id').eq('base_currency','THB').eq('quote_currency',c==='THB'?'LAK':'USD').maybeSingle();if(ex.data)await upd('exchange_rates',ex.data.id,{rate:rates[c],effective_at:new Date().toISOString()});else await ins('exchange_rates',{base_currency:'THB',quote_currency:c==='THB'?'LAK':'USD',rate:rates[c]})}toast('ບັນທຶກຕັ້ງຄ່າແລ້ວ');render()}catch(x){toast(x.message)}}
function modal(title,body){closeModal();let m=document.createElement('div');m.id='modal';m.className='modal';m.innerHTML='<div class="modalbox"><div class="between"><h2>'+title+'</h2><button class="secondary" onclick="closeModal()">×</button></div>'+body+'</div>';document.body.append(m)}
function closeModal(){$('modal')?.remove()}
async function logout(){await sb.auth.signOut()}
async function start(){let {data:{session}}=await sb.auth.getSession();user=session?.user||null;if(!user){loginView();return}render();sb.auth.onAuthStateChange((_e,s)=>{user=s?.user||null;user?render():loginView()})}
function loginView(){$('root').innerHTML='<div class="login"><div class="card loginbox"><h1>🛞 ລະບົບຮ້ານຢາງ & ອູ່ລົດ</h1><p class="muted">POS • ສະຕັອກ • ໃບສ້ອມລົດ</p>'+fld('ອີເມວ','email','email')+fld('ລະຫັດຜ່ານ','pw','password')+'<div id="loginmsg"></div><button style="width:100%;margin-top:14px" onclick="login()">ເຂົ້າລະບົບ</button><button class="secondary" style="width:100%;margin-top:8px" onclick="sendLoginReset()">ລືມລະຫັດຜ່ານ?</button></div></div>'}
async function login(){let {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('pw').value});if(error)$('loginmsg').innerHTML='<div class="notice">'+esc(error.message)+'</div>'}
async function sendLoginReset(){const email=$('email').value.trim();if(!email){$('loginmsg').innerHTML='<div class="notice">ກະລຸນາປ້ອນອີເມວກ່ອນ</div>';return}const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin});$('loginmsg').innerHTML=error?'<div class="notice">'+esc(error.message)+'</div>':'<div class="notice">ສົ່ງລິ້ງກູ້ລະຫັດໄປທີ່ອີເມວແລ້ວ. ກະລຸນາເປີດອີເມວເພື່ອຕັ້ງລະຫັດໃໝ່.</div>'}
function recoveryView(){$('root').innerHTML='<div class="login"><div class="card loginbox"><h1>🔐 ຕັ້ງລະຫັດຜ່ານໃໝ່</h1><p class="muted">ກະລຸນາປ້ອນລະຫັດຜ່ານໃໝ່</p>'+fld('ລະຫັດຜ່ານໃໝ່','newpw','password')+'<div id="recoverymsg"></div><button id="recoverbtn" style="width:100%;margin-top:14px" onclick="saveRecoveredPassword()">ບັນທຶກລະຫັດໃໝ່</button></div></div>'}
async function saveRecoveredPassword(){const password=$('newpw').value;if(password.length<6){$('recoverymsg').innerHTML='<div class="notice">ລະຫັດຜ່ານຕ້ອງມີຢ່າງໜ້ອຍ 6 ຕົວ</div>';return}const {error}=await sb.auth.updateUser({password});if(error){$('recoverymsg').innerHTML='<div class="notice">'+esc(error.message)+'</div>';return}await sb.auth.signOut();loginView();$('loginmsg').innerHTML='<div class="notice">ປ່ຽນລະຫັດສຳເລັດ. ກະລຸນາ Login ດ້ວຍລະຫັດໃໝ່.</div>'}
async function start(){sb.auth.onAuthStateChange((event,session)=>{user=session?.user||null;if(event==='PASSWORD_RECOVERY'){recoveryView();return}user?render():loginView()});let {data:{session}}=await sb.auth.getSession();user=session?.user||null;if(user)render();else loginView()}
start();
</script></body></html>
