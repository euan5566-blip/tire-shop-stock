function stockForm(id){if(!guardStock())return;let p=products.find(x=>String(x.id)===String(id));if(!p){toast('ບໍ່ພົບສິນຄ້າ');return}modal('ຮັບເຂົ້າສະຕັອກ: '+esc(p.name),'<div class="notice">ສະຕັອກປັດຈຸບັນ: <b>'+fmt(p.stock_on_hand)+'</b> '+esc(p.unit||'ອັນ')+'</div>'+fld('ຈຳນວນຮັບເຂົ້າ *','sq','number',1,'min="0.001" step="0.001"')+fld('ໝາຍເຫດ','snote','text','ຮັບເຂົ້າສາງ')+'<div class="row" style="margin-top:12px"><button data-stock-id="'+esc(id)+'" onclick="saveStock(this.dataset.stockId)">ບັນທຶກຮັບເຂົ້າ</button><button class="secondary" onclick="closeModal()">ປິດ</button></div>')}async function deleteProduct(id){if(!guardStock())return;let p=products.find(x=>String(x.id)===String(id));if(!p)return toast('ບໍ່ພົບສິນຄ້າ');if(!confirm('ຢືນຢັນລົບລາຍການ “'+p.name+'” ອອກຈາກສະຕ໋ອກ? ຖ້າມີປະຫວັດຂາຍ/ຮັບເຂົ້າ ລະບົບຈະຊ່ອນລາຍການແທນການລຶບປະຫວັດ.'))return;try{let refs=['sale_items','online_order_items','purchase_items','repair_order_items','stock_movements','quotation_items','warranty_records','inventory_orders','return_items'];let checks=await Promise.all(refs.map(t=>sb.from(t).select('id').eq('product_id',id).limit(1)));let used=checks.some(x=>x.error||x.data?.length);if(used){let u=await sb.from('products').update({active:false}).eq('id',id);if(u.error)throw u.error;toast('ຊ່ອນລາຍການແລ້ວ: ປະຫວັດເກົ່າຍັງຄົງຢູ່')}else{let d=await sb.from('products').delete().eq('id',id);if(d.error)throw d.error;toast('ລົບລາຍການສຳເລັດ')}await render()}catch(x){toast('ລົບລາຍການບໍ່ສຳເລັດ: '+(x.message||x.details||x))}}
function stockOutForm(id){if(!guardStock())return;let p=products.find(x=>String(x.id)===String(id));if(!p)return toast('ບໍ່ພົບສິນຄ້າ');modal('ລົບສະຕ໋ອກ: '+esc(p.name),'<div class="notice">ຈຳນວນຄົງເຫຼືອ: <b>'+fmt(p.stock_on_hand)+'</b> '+esc(p.unit||'ອັນ')+'</div>'+fld('ຈຳນວນທີ່ຈະລົບ *','soqty','number',1,'min="0.001" max="'+num(p.stock_on_hand)+'" step="0.001"')+fld('ເຫດຜົນ *','sonote','text','ເສຍຫາຍ / ປັບຍອດ')+'<div class="row" style="margin-top:12px"><button data-stock-id="'+esc(id)+'" onclick="saveStockOut(this.dataset.stockId)">ຢືນຢັນລົບສະຕ໋ອກ</button><button class="secondary" onclick="closeModal()">ປິດ</button></div>')}async function saveStockOut(id){if(!guardStock())return;let p=products.find(x=>String(x.id)===String(id));if(!p)return toast('ບໍ່ພົບສິນຄ້າ');let qty=Number($('soqty')?.value),note=$('sonote')?.value?.trim();if(!Number.isFinite(qty)||qty<=0||qty>num(p.stock_on_hand))return toast('ຈຳນວນລົບບໍ່ຖືກ ຫຼື ເກີນສະຕ໋ອກ');if(!note)return toast('ກະລຸນາລະບຸເຫດຜົນ');if(!confirm('ຢືນຢັນລົບ '+fmt(qty)+' '+(p.unit||'ອັນ')+' ອອກຈາກສະຕ໋ອກ?'))return;let before=num(p.stock_on_hand),after=before-qty;try{let u=await sb.from('products').update({stock_on_hand:after}).eq('id',id);if(u.error)throw u.error;let m=await sb.from('stock_movements').insert({product_id:id,movement_type:'adjustment_out',qty,stock_before:before,stock_after:after,note,created_by:user.id});if(m.error)throw m.error;closeModal();toast('ລົບສະຕ໋ອກສຳເລັດ');await render()}catch(x){toast('ລົບສະຕ໋ອກບໍ່ສຳເລັດ: '+(x.message||x.details||x))}}
async function saveStock(id){if(!guardStock())return;let p=products.find(x=>String(x.id)===String(id));if(!p){toast('ບໍ່ພົບສິນຄ້າ');return}let raw=$('sq')?.value,qty=Number(raw);if(!Number.isFinite(qty)||qty<=0){toast('ກະລຸນາປ້ອນຈຳນວນຮັບເຂົ້າໃຫ້ຫຼາຍກວ່າ 0');return}let before=num(p.stock_on_hand),after=before+qty;try{let pr=await sb.from('products').update({stock_on_hand:after}).eq('id',id);if(pr.error)throw pr.error;let mr=await sb.from('stock_movements').insert({product_id:id,movement_type:'purchase_in',qty,stock_before:before,stock_after:after,note:$('snote')?.value?.trim()||'ຮັບເຂົ້າສາງ',created_by:user.id});if(mr.error)throw mr.error;let savedScrollY=window.scrollY;closeModal();toast('ຮັບເຂົ້າສະຕັອກສຳເລັດ: '+fmt(after));await render();window.scrollTo(0,savedScrollY)}catch(x){toast('ບັນທຶກສະຕັອກບໍ່ສຳເລັດ: '+(x.message||x.details||x))}}
async function customerPage(e){let ss=await sel('sales','id,sale_no,customer_id,total,paid_amount,balance_due,currency,sale_date,due_date');let ds=ss.filter(s=>num(s.balance_due)>0&&s.customer_id),totalDebt=ds.reduce((a,s)=>a+num(s.balance_due),0);e.innerHTML=head(pages.customers,'<button onclick="customerForm()">＋ ເພີ່ມລູກຄ້າ</button>')+'<div class="card">'+tbl(['ຊື່ລູກຄ້າ','ເບີໂທ','ທີ່ຢູ່','ລົດ','ຈັດການ'],customers.map(c=>'<tr><td>'+esc(c.name)+'</td><td>'+esc(c.phone||'—')+'</td><td>'+esc(c.address||'—')+'</td><td>'+vehicles.filter(v=>v.customer_id===c.id).length+'</td><td><button class="secondary" onclick="customerForm(\''+c.id+'\')">ແກ້ໄຂ</button> <button class="secondary" onclick="deleteCustomer(\''+c.id+'\')">ລົບ</button></td></tr>'))+'</div><div class="card" style="margin-top:14px"><h2>ລູກໜີ້ / ຍອດຄ້າງຊຳລະ</h2><div class="stat" style="margin-bottom:12px">ຍອດໜີ້ລວມ: '+fmt(totalDebt)+'</div>'+tbl(['ເລກບິນ','ລູກຄ້າ','ວັນທີຂາຍ','ກຳນົດຊຳລະ','ຍອດຂາຍ','ຈ່າຍແລ້ວ','ຍັງຄ້າງ','ຈັດການ'],ds.map(s=>'<tr><td>'+esc(s.sale_no||s.id)+'</td><td>'+esc(customers.find(c=>c.id===s.customer_id)?.name||'')+'</td><td>'+esc(s.sale_date||'')+'</td><td><b style="color:'+(s.due_date&&s.due_date<new Date().toISOString().slice(0,10)?'var(--danger)':'inherit')+'">'+esc(s.due_date||'—')+'</b></td><td>'+fmt(s.total)+' '+esc(s.currency)+'</td><td>'+fmt(s.paid_amount)+' '+esc(s.currency)+'</td><td><b>'+fmt(s.balance_due)+' '+esc(s.currency)+'</b></td><td><button onclick="receiveDebt(\''+s.id+'\')">ຮັບຊຳລະ</button></td></tr>'))+'</div>'}
function receiveDebt(id){sel('sales','id,sale_no,total,paid_amount,balance_due,currency').then(rows=>{let s=rows.find(x=>x.id===id);if(!s)return;modal('ຮັບຊຳລະ '+(s.sale_no||''),fld('ຈຳນວນຮັບ ('+s.currency+')','payamt','number',s.balance_due,'min="0.01" max="'+s.balance_due+'" step="0.01"')+'<div class="row" style="margin-top:12px"><button onclick="saveDebt(\''+id+'\')">ບັນທຶກຮັບເງິນ</button><button class="secondary" onclick="closeModal()">ປິດ</button></div>')})}async function saveDebt(id){try{let ss=await sel('sales','id,total,paid_amount,balance_due,currency'),s=ss.find(x=>x.id===id),a=num($('payamt').value);if(!s||a<=0||a>num(s.balance_due))throw Error('ຈຳນວນຮັບບໍ່ຖືກ');await ins('sale_payments',{sale_id:id,amount:a,currency:s.currency,payment_method:'cash',received_by:user.id});await upd('sales',id,{paid_amount:num(s.paid_amount)+a,balance_due:num(s.balance_due)-a});closeModal();toast('ຮັບຊຳລະແລ້ວ');render()}catch(x){toast(x.message||x)}}function customerForm(id=''){let c=customers.find(x=>x.id===id)||{};modal(id?'ແກ້ໄຂລູກຄ້າ':'ເພີ່ມລູກຄ້າ','<div class="formgrid">'+fld('ຊື່ *','cn','text',c.name||'')+fld('ເບີໂທ','ct','text',c.phone||'')+fld('ອີເມວ','ce','email',c.email||'')+fld('ທີ່ຢູ່','ca','text',c.address||'')+'</div><div class="row" style="margin-top:12px"><button onclick="saveCustomer(\''+id+'\')">ບັນທຶກ</button><button class="secondary" onclick="closeModal()">ປິດ</button></div>')}
async function saveCustomer(id=''){try{let d={name:$('cn').value.trim(),phone:$('ct').value.trim(),address:$('ca').value.trim(),email:$('ce').value.trim()};if(!d.name)throw Error('ກະລຸນາໃສ່ຊື່ລູກຄ້າ');if(id)await upd('customers',id,d);else await ins('customers',d);closeModal();toast('ບັນທຶກລູກຄ້າສຳເລັດ');render()}catch(x){toast(x.message||x)}}
async function deleteCustomer(id){if(!confirm('ຢືນຢັນລົບລູກຄ້າ? ຖ້າມີລົດ/ປະຫວັດຜູກຢູ່ ຈະບໍ່ລົບ.'))return;try{let [vs,rs,ss]=await Promise.all([sb.from('vehicles').select('id').eq('customer_id',id),sb.from('repair_orders').select('id').eq('customer_id',id),sb.from('sales').select('id').eq('customer_id',id)]);if(vs.data?.length||rs.data?.length||ss.data?.length)throw Error('ລູກຄ້າມີລົດ ຫຼື ປະຫວັດຂາຍ/ສ້ອມ ຈຶ່ງລົບບໍ່ໄດ້. ໃຫ້ແກ້ໄຂຂໍ້ມູນແທນ.');let r=await sb.from('customers').delete().eq('id',id);if(r.error)throw r.error;toast('ລົບສຳເລັດ');render()}catch(x){toast(x.message||x)}}
async function vehiclePage(e){e.innerHTML=head(pages.vehicles,'<button onclick="vehicleForm()">＋ ເພີ່ມລົດ</button>')+'<div class="card">'+tbl(['ທະບຽນ','ຍີ່ຫໍ້ / ລຸ້ນ','ສີ','VIN','ເຈົ້າຂອງ','ຈັດການ'],vehicles.map(v=>'<tr><td><b>'+esc(v.plate)+'</b></td><td>'+esc((v.brand||'')+' '+(v.model||''))+'</td><td>'+esc(v.color||'—')+'</td><td>'+esc(v.vin||'—')+'</td><td>'+esc(customers.find(c=>c.id===v.customer_id)?.name||'')+'</td><td><button class="secondary" onclick="vehicleForm(\''+v.id+'\')">ແກ້ໄຂ</button> <button class="secondary" onclick="deleteVehicle(\''+v.id+'\')">ລົບ</button></td></tr>'))+'</div>'}
function vehicleForm(id=''){let v=vehicles.find(x=>x.id===id)||{};modal(id?'ແກ້ໄຂຂໍ້ມູນລົດ':'ເພີ່ມລົດ','<div class="formgrid">'+sfield('ເຈົ້າຂອງ *','vc',customerOpts(),v.customer_id||'')+fld('ທະບຽນ *','vp','text',v.plate||'')+fld('VIN','vvin','text',v.vin||'')+fld('ຍີ່ຫໍ້','vb','text',v.brand||'')+fld('ລຸ້ນ','vm','text',v.model||'')+fld('ປີ','vy','number',v.year||'')+fld('ສີ','vcolor','text',v.color||'')+fld('ເລກເຄື່ອງ','ve','text',v.engine_no||'')+'</div><div class="row" style="margin-top:12px"><button onclick="saveVehicle(\''+id+'\')">ບັນທຶກ</button><button class="secondary" onclick="closeModal()">ປິດ</button></div>')}
async function saveVehicle(id=''){try{let d={customer_id:$('vc').value,plate:$('vp').value.trim(),vin:$('vvin').value.trim(),brand:$('vb').value.trim(),model:$('vm').value.trim(),year:num($('vy').value)||null,color:$('vcolor').value.trim(),engine_no:$('ve').value.trim()};if(!d.customer_id||!d.plate)throw Error('ກະລຸນາເລືອກເຈົ້າຂອງ ແລະ ໃສ່ທະບຽນ');if(id)await upd('vehicles',id,d);else await ins('vehicles',d);closeModal();toast('ບັນທຶກຂໍ້ມູນລົດສຳເລັດ');render()}catch(x){toast(x.message||x)}}
async function deleteVehicle(id){if(!confirm('ຢືນຢັນລົບລົດ? ລົດທີ່ມີປະຫວັດສ້ອມຈະລົບບໍ່ໄດ້.'))return;try{let r=await sb.from('repair_orders').select('id').eq('vehicle_id',id);if(r.data?.length)throw Error('ລົດຄັນນີ້ມີປະຫວັດສ້ອມ ຈຶ່ງລົບບໍ່ໄດ້.');let d=await sb.from('vehicles').delete().eq('id',id);if(d.error)throw d.error;toast('ລົບສຳເລັດ');render()}catch(x){toast(x.message||x)}}
async function repairPage(e){let ros=await sel('repair_orders');ros.sort((a,b)=>new Date(b.opened_at)-new Date(a.opened_at));let states=['open','diagnosing','waiting_parts','in_progress','ready','delivered','cancelled'];let rows=ros.map(r=>'<tr><td><b>'+esc(r.ro_no)+'</b></td><td>'+esc(customers.find(c=>c.id===r.customer_id)?.name||'')+'</td><td>'+esc(vehicles.find(v=>v.id===r.vehicle_id)?.plate||'')+'</td><td>'+esc(r.complaint)+'</td><td>'+esc(r.work_type)+'</td><td><select onchange="changeRO(&quot;'+r.id+'&quot;,this.value)">'+states.map(s=>'<option value="'+s+'" '+(s===r.status?'selected':'')+'>'+s+'</option>').join('')+'</select></td><td>'+new Date(r.opened_at).toLocaleDateString('lo-LA')+'</td><td><button class="secondary" onclick="roItems(&quot;'+r.id+'&quot;)">＋ ລາຍການ</button> <button class="secondary" onclick="roPay(&quot;'+r.id+'&quot;)">ຮັບເງິນ</button></td></tr>');e.innerHTML=head(pages.repair,'<button onclick="repairForm()">＋ ເປີດໃບສ້ອມ</button>')+'<div class="card">'+tbl(['ເລກ RO','ລູກຄ້າ','ລົດ','ອາການ','ປະເພດ','ສະຖານະ','ວັນທີ','ຈັດການ'],rows)+'</div>'}
function repairForm(){modal('ເປີດໃບສ້ອມ (Repair Order)','<div class="formgrid">'+sfield('ລູກຄ້າ *','rc',customerOpts())+sfield('ລົດ *','rv',vehicleOpts())+sfield('ຊ່າງຜູ້ຮັບຜິດຊອບ','ra',staffOpts())+sfield('ປະເພດວຽກ','rt',['ປ່ຽນຢາງ','ບໍລິການລໍ້','ສ້ອມຊ່ວງລ່າງ','ສ້ອມເຄື່ອງ','ສ້ອມເກຍ','ສ້ອມທົ່ວໄປ'].map(x=>({value:x,label:x})))+'<div class="field wide"><label>ອາການທີ່ລູກຄ້າແຈ້ງ *</label><textarea id="rcomp"></textarea></div><div class="field wide"><label>ການກວດພົບ / ໝາຍເຫດ</label><textarea id="rdiag"></textarea></div></div><div class="row" style="margin-top:12px"><button onclick="saveRO()">ສ້າງໃບສ້ອມ</button><button class="secondary" onclick="closeModal()">ປິດ</button></div>')}
async function saveRO(){try{await ins('repair_orders',{customer_id:$('rc').value,vehicle_id:$('rv').value,assigned_to:$('ra').value||null,work_type:$('rt').value,complaint:$('rcomp').value,diagnosis:$('rdiag').value,status:'open',created_by:user.id});closeModal();toast('ສ້າງໃບສ້ອມແລ້ວ');render()}catch(x){toast(x.message)}}
async function changeRO(id,status){try{await upd('repair_orders',id,{status,completed_at:status==='delivered'?new Date().toISOString():null});toast('ປ່ຽນສະຖານະແລ້ວ')}catch(x){toast(x.message)}}

async function saveROItem(id){try{let ro=(await sel('repair_orders')).find(x=>x.id===id),type=$('rit').value,prod=products.find(x=>x.id===$('rip').value),qty=num($('riq').value),price=num($('riu').value),desc=$('rid').value||(prod?.name)||type,total=qty*price;if(type==='part'&&prod){if(num(prod.stock_on_hand)<qty)throw Error('ສະຕັອກອະໄຫຼ່ບໍ່ພໍ');let after=num(prod.stock_on_hand)-qty;await upd('products',prod.id,{stock_on_hand:after});await ins('stock_movements',{product_id:prod.id,movement_type:'repair_issue',qty,stock_before:prod.stock_on_hand,stock_after:after,ref_table:'repair_orders',ref_id:id,created_by:user.id})}await ins('repair_order_items',{repair_order_id:id,line_type:type,product_id:type==='part'&&prod?prod.id:null,description:desc,qty,unit_cost:prod?num(prod.cost_lak):0,unit_price:price,line_total:total,stock_issued:type==='part'&&!!prod});let parts=num(ro.parts_total)+(type==='part'?total:0),labor=num(ro.labor_total)+(type!=='part'?total:0);await upd('repair_orders',id,{parts_total:parts,labor_total:labor,total:parts+labor-num(ro.discount),balance_due:parts+labor-num(ro.discount)-num(ro.paid_amount)});closeModal();toast('ເພີ່ມລາຍການແລ້ວ');render()}catch(x){toast(x.message)}}

async function returnSale(id){try{let ss=await sel('sales'),sale=ss.find(s=>s.id===id);if(!sale)return;let items=(await sel('sale_items')).filter(i=>i.sale_id===id),prior=await sel('return_items'),returned={};prior.forEach(i=>returned[i.sale_item_id]=(returned[i.sale_item_id]||0)+num(i.qty));let body='<div class="field"><label>ເຫດຜົນຄືນ</label><input id="retreason" value="ລູກຄ້າຄືນສິນຄ້າ"></div><div class="field"><label>ວິທີຈັດການ</label><select id="retdisp"><option value="restock">ຄືນເຂົ້າສະຕັອກ (ສິນຄ້າສົມບູນ)</option><option value="damaged">ເສຍຫາຍ</option><option value="reject">ບໍ່ຮັບເຂົ້າສະຕັອກ</option></select></div>';items.forEach((i,n)=>{let remain=num(i.qty)-(returned[i.id]||0);body+='<div class="field"><label>'+esc(i.description)+' — ຄືນໄດ້ '+remain+'</label><input id="retqty'+n+'" type="number" min="0" max="'+remain+'" step="1" value="0" data-price="'+i.unit_price+'" data-item="'+i.id+'" data-product="'+(i.product_id||'')+'" data-desc="'+esc(i.description)+'" data-cost="'+i.unit_cost+'"></div>'});body+='<p>ລະບົບຈະຄຳນວນຍອດຄືນ ແລະ ປັບສະຕັອກ.</p><button onclick="saveReturn(\''+id+'\')">ຢືນຢັນຄືນສິນຄ້າ</button> <button class="secondary" onclick="closeModal()">ຍົກເລີກ</button>';modal('ຄືນສິນຄ້າ '+sale.sale_no,body)}catch(x){toast(x.message||x)}}
async function saveReturn(saleId){try{let sale=(await sel('sales')).find(s=>s.id===saleId),items=(await sel('sale_items')).filter(i=>i.sale_id===saleId),allRet=await sel('return_items'),retBy={};allRet.forEach(i=>retBy[i.sale_item_id]=(retBy[i.sale_item_id]||0)+num(i.qty));let chosen=[],total=0;items.forEach((it,n)=>{let el=$('retqty'+n),q=num(el?.value),remaining=num(it.qty)-(retBy[it.id]||0);if(q<0||q>remaining)throw Error('ຈຳນວນຄືນບໍ່ຖືກ');if(q>0){chosen.push({it,q,amount:q*num(it.unit_price)});total+=q*num(it.unit_price)}});if(!chosen.length)throw Error('ກະລຸນາໃສ່ຈຳນວນຄືນ');let ret=await ins('returns',{sale_id:saleId,reason:$('retreason').value,disposition:$('retdisp').value,refund_method:'cash',currency:sale.currency,total_refund:total,status:'completed',processed_by:user.id});for(let x of chosen){await ins('return_items',{return_id:ret.id,sale_item_id:x.it.id,product_id:x.it.product_id,description:x.it.description,qty:x.q,unit_price:x.it.unit_price,line_total:x.amount});if(x.it.product_id&&$('retdisp').value==='restock'){let p=products.find(p=>p.id===x.it.product_id);if(p){let before=num(p.stock_on_hand),after=before+x.q;await upd('products',p.id,{stock_on_hand:after});await ins('stock_movements',{product_id:p.id,movement_type:'return_in',qty:x.q,stock_before:before,stock_after:after,ref_table:'returns',ref_id:ret.id,created_by:user.id})}}}await upd('sales',saleId,{total:Math.max(0,num(sale.total)-total),paid_amount:Math.max(0,num(sale.paid_amount)-total),balance_due:Math.max(0,num(sale.balance_due))});closeModal();toast('ບັນທຶກຄືນສິນຄ້າແລ້ວ');await render()}catch(x){toast('ຄືນບໍ່ສຳເລັດ: '+(x.message||x))}}

async function startBarcodeScanner(target){let host=$(target==='product'?'product-scan-panel':'pos-scan-panel');if(!host)return;if(activeBarcodeScanner)await stopBarcodeScanner();host.innerHTML='<div class="notice">ກຳລັງເປີດກ້ອງ... ກະລຸນາກົດ Allow ເມື່ອ Safari ຖາມສິດໃຊ້ກ້ອງ</div><div style="font-size:13px;text-align:center;margin:8px 0;color:#475569">ບາໂຄດນ້ອຍ: ກົດ + ເພື່ອຊູມກ້ອງ ຫຼືເລື່ອນໂທລະສັບເຂົ້າໃກ້ໆ ໃຫ້ເສັ້ນບາໂຄດຊັດ ແລະຖືໃຫ້ນິ່ງ</div><div style="display:flex;gap:8px;margin:8px 0"><button type="button" class="secondary" style="flex:1" onclick="adjustBarcodeZoom(-1)">− ຊູມອອກ</button><button type="button" class="secondary" style="flex:1" onclick="adjustBarcodeZoom(1)">＋ ຊູມເຂົ້າ</button></div><div id="barcode-zoom-status" class="muted" style="text-align:center;font-size:12px">ກຳລັງກວດສອບການຊູມ...</div><div id="barcode-reader" style="width:100%;max-width:700px;margin:8px auto"></div><button type="button" class="secondary" style="width:100%;margin:6px 0" onclick="closeBarcodeScanner()">ປິດກ້ອງ</button>';try{if(!window.isSecureContext)throw Error('ກ້ອງຕ້ອງໃຊ້ຜ່ານ HTTPS. ກະລຸນາເປີດ https://tire-shop-stock.vercel.app ໃນ Safari');if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw Error('Safari ບໍ່ສາມາດເປີດກ້ອງໄດ້. ກະລຸນາເປີດເວັບໃນ Safari ບໍ່ແມ່ນ browser ທີ່ຝັງໃນແອັບ');await ensureBarcodeLibrary();if(!$('barcode-reader'))return;let formats=[Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.UPC_E,Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.CODE_39,Html5QrcodeSupportedFormats.ITF,Html5QrcodeSupportedFormats.CODABAR,Html5QrcodeSupportedFormats.QR_CODE,Html5QrcodeSupportedFormats.DATA_MATRIX].filter(x=>x!==undefined);let sc=new Html5Qrcode('barcode-reader',{formatsToSupport:formats,verbose:false});activeBarcodeScanner=sc;await sc.start({facingMode:'environment'},{fps:15,qrbox:(viewWidth,viewHeight)=>{let w=Math.max(240,Math.min(900,Math.floor(viewWidth*.94)));let h=Math.max(150,Math.min(360,Math.floor(viewHeight*.48)));return{width:w,height:h}},disableFlip:true,experimentalFeatures:{useBarCodeDetectorIfSupported:true},videoConstraints:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30,max:60}}},async decoded=>{if(barcodeScanBusy)return;barcodeScanBusy=true;let code=String(decoded||'').trim();await stopBarcodeScanner();let panel=$(target==='product'?'product-scan-panel':'pos-scan-panel');if(panel)panel.innerHTML='';if(target==='product'){if($('pb')){$('pb').value=code;$('pb').dispatchEvent(new Event('input',{bubbles:true}));$('pb').focus();toast('ອ່ານບາໂຄດໄດ້ແລ້ວ: '+code)}}else{let p=products.find(x=>x.active&&String(x.barcode||'').trim()===code);if(!p){if($('posq')){$('posq').value=code;posSearch()}toast('ບໍ່ພົບບາໂຄດ '+code+' ໃນສະຕ໋ອກ. ກະລຸນາເພີ່ມສິນຄ້າກ່ອນ')}else if(num(p.stock_on_hand)<=0){toast('ສິນຄ້າໝົດສະຕ໋ອກ: '+p.name)}else{addCart(p.id);toast('ເພີ່ມ '+p.name+' ເຂົ້າບິນແລ້ວ')}}},()=>{});host.querySelector('.notice').textContent='ກ້ອງພ້ອມແລ້ວ: ສ່ອງບາໂຄດໃຫ້ເຕັມກອບ ແລະຖືໃຫ້ນິ່ງ';activeBarcodeZoom=1;let caps=sc.getRunningTrackCapabilities?sc.getRunningTrackCapabilities():{};let status=$('barcode-zoom-status');if(caps.zoom){let z=caps.zoom;activeBarcodeZoom=Math.max(z.min??1,Math.min(4,z.max??4));try{await sc.applyVideoConstraints({advanced:[{zoom:activeBarcodeZoom}]});if(status)status.textContent='ຕັ້ງຊູມເລີ່ມຕົ້ນ '+activeBarcodeZoom.toFixed(1)+'×';}catch(_e){activeBarcodeZoom=1;if(status)status.textContent='ກ້ອງບໍ່ອະນຸຍາດຊູມອັດຕະໂນມັດ';}}else if(status)status.textContent='ລຸ່ນນີ້ບໍ່ຮອງຮັບຊູມຜ່ານ browser';}catch(e){await stopBarcodeScanner();let msg=e.name==='NotAllowedError'?'Safari ບໍ່ໄດ້ຮັບອະນຸຍາດໃຊ້ກ້ອງ. ໄປທີ່ Settings > Safari > Camera > Allow.':e.name==='NotFoundError'?'ບໍ່ພົບກ້ອງໃນອຸປະກອນ.':e.name==='NotReadableError'?'ກ້ອງກຳລັງຖືກແອັບອື່ນໃຊ້ຢູ່. ປິດແອັບກ້ອງແລ້ວລອງໃໝ່.':(e.message||String(e));host.innerHTML='<div class="notice">'+esc(msg)+'<br>ລອງເປີດລິ້ງໂດຍກົງໃນ Safari ແລະອະນຸຍາດ Camera.</div><button type="button" class="secondary" onclick="closeBarcodeScanner()">ປິດ</button>'}}
let activeBarcodeZoom=1;async function adjustBarcodeZoom(dir){let sc=activeBarcodeScanner,status=$('barcode-zoom-status');if(!sc){if(status)status.textContent='ກ້ອງຍັງບໍ່ພ້ອມ';return}try{let caps=sc.getRunningTrackCapabilities?sc.getRunningTrackCapabilities():{},z=caps.zoom;if(!z){if(status)status.textContent='ກ້ອງ iPhone/Safari ບໍ່ຮອງຮັບຊູມຜ່ານເວັບ: ໃຫ້ເລື່ອນກ້ອງເຂົ້າໃກ້ສະຫຼາກ';return}let step=z.step||0.25;activeBarcodeZoom=Math.max(z.min??1,Math.min(z.max??4,activeBarcodeZoom+dir*step));await sc.applyVideoConstraints({advanced:[{zoom:activeBarcodeZoom}]});if(status)status.textContent='ຊູມ '+activeBarcodeZoom.toFixed(2)+'×'}catch(e){if(status)status.textContent='ອຸປະກອນບໍ່ຮອງຮັບຊູມ: ເລື່ອນກ້ອງເຂົ້າໃກ້ສະຫຼາກ'}}

async function loadJsBarcode(){if(window.JsBarcode)return;await new Promise((resolve,reject)=>{let sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js';sc.onload=()=>window.JsBarcode?resolve():reject(Error('ໂຫຼດລະບົບສ້າງບາໂຄດບໍ່ສຳເລັດ'));sc.onerror=()=>reject(Error('ກວດອິນເຕີເນັດແລ້ວລອງໃໝ່'));document.head.append(sc)})}
function makeInternalBarcode(){return '20'+Date.now().toString().slice(-10)+Math.floor(Math.random()*10)}
async function generateProductBarcode(){let code=$('pb')?.value.trim();if(!code){code=makeInternalBarcode();$('pb').value=code}try{await loadJsBarcode();let box=$('barcode-preview');if(!box)return;box.innerHTML='<div style="background:white;padding:12px;text-align:center;border:1px solid #ddd;border-radius:8px"><svg id="generated-barcode"></svg><div style="font-weight:700;margin-top:4px">'+esc(code)+'</div><button type="button" class="secondary" style="margin-top:8px" onclick="printProductBarcode()">🖨 ພິມບາໂຄດ</button></div>';JsBarcode('#generated-barcode',code,{format:'CODE128',displayValue:false,lineColor:'#000',width:2,height:65,margin:8});}catch(e){toast('ສ້າງບາໂຄດບໍ່ໄດ້: '+(e.message||e))}}

async function receiveInventoryOrder(id){try{let o=(await sel('inventory_orders')).find(x=>x.id===id);if(!o||o.status!=='ordered')return;if(o.product_id){let p=products.find(x=>x.id===o.product_id);if(p){let before=num(p.stock_on_hand),after=before+num(o.qty);await upd('products',p.id,{stock_on_hand:after});await ins('stock_movements',{product_id:p.id,movement_type:'purchase_in',qty:o.qty,stock_before:before,stock_after:after,ref_table:'inventory_orders',ref_id:o.id,created_by:user.id})}}await upd('inventory_orders',id,{status:'received',received_at:new Date().toISOString().slice(0,10)});toast('ຮັບສິນຄ້າເຂົ້າແລ້ວ');await render()}catch(x){toast(x.message||x)}}
async function setInventoryOrder(id,status){try{await upd('inventory_orders',id,{status});toast('ປ່ຽນສະຖານະແລ້ວ');await render()}catch(x){toast(x.message||x)}}
async function customerOrdersPage(e){let rows=await sel('customer_special_orders');rows.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));let labels={ordered:'ສັ່ງແລ້ວ/ລໍຖ້າສິນຄ້າ',arrived:'ສິນຄ້າມາຮອດ',received:'ລູກຄ້າຮັບແລ້ວ',cancelled:'ຍົກເລີກ'};let body=rows.map(o=>'<tr><td>'+esc(o.order_no)+'</td><td>'+esc(o.customer_name)+'</td><td>'+esc(o.customer_phone)+'</td><td>'+esc(o.product_name)+' × '+fmt(o.qty)+'</td><td>'+fmt(o.total)+' '+esc(o.currency)+'</td><td>'+fmt(o.deposit)+'</td><td>'+fmt(Math.max(0,num(o.total)-num(o.deposit)))+'</td><td>'+esc(labels[o.status]||o.status)+'</td><td><button class="secondary" data-id="'+esc(o.id)+'" onclick="printCustomerSpecialOrder(this.dataset.id)">ພິມບິນ</button>'+(o.status==='ordered'?'<button data-id="'+esc(o.id)+'" data-status="arrived" onclick="setCustomerOrder(this.dataset.id,this.dataset.status)">ສິນຄ້າມາແລ້ວ</button>':'')+(o.status==='arrived'?'<button data-id="'+esc(o.id)+'" data-status="received" onclick="setCustomerOrder(this.dataset.id,this.dataset.status)">ລູກຄ້າຮັບແລ້ວ</button>':'')+(o.status==='ordered'?'<button class="secondary" data-id="'+esc(o.id)+'" data-status="cancelled" onclick="setCustomerOrder(this.dataset.id,this.dataset.status)">ຍົກເລີກ</button>':'')+'</td></tr>').join('');e.innerHTML=head(pages.customerOrders,'<button onclick="customerOrderForm()">＋ ອໍເດີພິເສດ</button>')+'<div class="card">'+tbl(['ເລກອໍເດີ','ລູກຄ້າ','ເບີໂທ','ສິນຄ້າ','ຍອດ','ມັດຈຳ','ຄ້າງ','ສະຖານະ','ຈັດການ'],body.split('</tr>').filter(Boolean).map(x=>x+'</tr>'))+'</div>'}
function customerOrderForm(){modal('ບັນທຶກອໍເດີພິເສດລູກຄ້າ','<div class="formgrid">'+sfield('ລູກຄ້າ','co_customer',[{value:'',label:'— ລູກຄ້າໃໝ່ —'},...customerOpts()])+fld('ຊື່ລູກຄ້າ *','co_name')+fld('ເບີໂທ','co_phone')+fld('ສິນຄ້າທີ່ສັ່ງ *','co_product')+fld('ຈຳນວນ','co_qty','number',1)+fld('ຍອດລວມ','co_total','number',0)+fld('ມັດຈຳ','co_deposit','number',0)+sfield('ສະກຸນເງິນ','co_cur',['LAK','THB','USD'].map(x=>({value:x,label:x})))+fld('ວັນສັ່ງ','co_date','date',new Date().toISOString().slice(0,10))+fld('ໝາຍເຫດ','co_note')+'</div><button onclick="saveCustomerOrder()">ບັນທຶກ</button> <button class="secondary" onclick="closeModal()">ປິດ</button>')}
async function saveCustomerOrder(){try{let qty=num($('co_qty').value),total=num($('co_total').value),deposit=num($('co_deposit').value),customer=customers.find(c=>c.id===$('co_customer').value),name=customer?.name||$('co_name').value.trim(),phone=customer?.phone||$('co_phone').value.trim();if(!name||!$('co_product').value.trim()||qty<=0||total<0||deposit<0||deposit>total)throw Error('ກວດຂໍ້ມູນອໍເດີ/ມັດຈຳ');await ins('customer_special_orders',{customer_id:customer?.id||null,customer_name:name,customer_phone:phone,product_name:$('co_product').value.trim(),qty,total,deposit,currency:$('co_cur').value,ordered_at:dateValue('co_date'),note:$('co_note').value,created_by:user.id});closeModal();toast('ບັນທຶກອໍເດີລູກຄ້າແລ້ວ');await render()}catch(x){toast(x.message||x)}}
async function printCustomerSpecialOrder(id){try{let o=(await sel('customer_special_orders')).find(x=>x.id===id);if(!o)return;let w=window.open('','_blank');if(!w){toast('ອະນຸຍາດ popup ເພື່ອພິມ');return}w.document.write('<html><head><meta charset="utf-8"><title>ອໍເດີ '+esc(o.order_no)+'</title><style>body{font:14px Arial;margin:24px}</style></head><body><h2>'+esc(shop.name||'ຮ້ານຢາງ')+'</h2><h3>ໃບສັ່ງຈອງ / ອໍເດີພິເສດ</h3><p>ເລກອໍເດີ: '+esc(o.order_no)+' | ວັນທີ: '+dateFmt(o.ordered_at)+'</p><p>ລູກຄ້າ: '+esc(o.customer_name)+' | ເບີ: '+esc(o.customer_phone||'—')+'</p><p>ສິນຄ້າ: '+esc(o.product_name)+' × '+fmt(o.qty)+'</p><h3>ຍອດ: '+fmt(o.total)+' '+esc(o.currency)+' | ມັດຈຳ: '+fmt(o.deposit)+' | ຄ້າງ: '+fmt(Math.max(0,num(o.total)-num(o.deposit)))+'</h3><p>ໝາຍເຫດ: '+esc(o.note||'—')+'</p><p>ລາຍເຊັນລູກຄ້າ: __________________</p><script>window.onload=()=>window.print()<\\/script></body></html>');w.document.close()}catch(x){toast(x.message||x)}}async function setCustomerOrder(id,status){try{let vals={status};if(status==='arrived')vals.arrived_at=new Date().toISOString().slice(0,10);if(status==='received')vals.received_at=new Date().toISOString().slice(0,10);await upd('customer_special_orders',id,vals);toast('ອັບເດດສະຖານະແລ້ວ');await render()}catch(x){toast(x.message||x)}}
async function warrantyPage(e){let rows=await sel('warranty_records');rows.sort((a,b)=>new Date(a.warranty_end)-new Date(b.warranty_end));let now=new Date().toISOString().slice(0,10);e.innerHTML=head(pages.warranty,'<button onclick="warrantyForm()">＋ ເພີ່ມປະກັນ</button>')+'<div class="card">'+tbl(['ລູກຄ້າ','ລົດ','ລາຍລະອຽດ','ເລີ່ມປະກັນ','ໝົດປະກັນ','ສະຖານະ'],rows.map(w=>{let status=w.status==='void'?'ຍົກເລີກ':w.status==='claimed'?'ເຄີຍເຄລມ':w.warranty_end<now?'ໝົດປະກັນ':'ຍັງຢູ່ໃນປະກັນ';return '<tr><td>'+esc(customers.find(x=>x.id===w.customer_id)?.name||'—')+'</td><td>'+esc(vehicles.find(x=>x.id===w.vehicle_id)?.plate||'—')+'</td><td>'+esc(w.description)+'</td><td>'+esc(dateFmt(w.warranty_start))+'</td><td>'+esc(dateFmt(w.warranty_end))+'</td><td>'+esc(status)+'</td></tr>'}))+'</div>'}
function warrantyForm(){modal('ເພີ່ມປະກັນສ້ອມແປງ/ສິນຄ້າ','<div class="formgrid">'+sfield('ລູກຄ້າ','wcustomer',[{value:'',label:'— ບໍ່ລະບຸ —'},...customerOpts()])+sfield('ລົດ','wvehicle',[{value:'',label:'— ບໍ່ລະບຸ —'},...vehicleOpts()])+sfield('ສິນຄ້າ','wproduct',[{value:'',label:'— ບໍ່ລະບຸ —'},...productOpts()])+sfield('ປະເພດ','wtype',[{value:'repair',label:'ສ້ອມແປງ'},{value:'product',label:'ສິນຄ້າ'},{value:'service',label:'ບໍລິການ'}])+fld('ລາຍລະອຽດ *','wdesc')+fld('ວັນເລີ່ມປະກັນ','wstart','date',new Date().toISOString().slice(0,10))+fld('ວັນໝົດປະກັນ *','wend','date')+fld('ໝາຍເຫດ','wnote')+'</div><button onclick="saveWarranty()">ບັນທຶກ</button> <button class="secondary" onclick="closeModal()">ປິດ</button>')}
async function saveWarranty(){try{let end=dateValue('wend'),start=dateValue('wstart');if(!end||end<start)throw Error('ກະລຸນາກວດວັນໝົດປະກັນ');await ins('warranty_records',{customer_id:$('wcustomer').value||null,vehicle_id:$('wvehicle').value||null,product_id:$('wproduct').value||null,warranty_type:$('wtype').value,description:$('wdesc').value,warranty_start:start,warranty_end:end,note:$('wnote').value,created_by:user.id});closeModal();toast('ບັນທຶກປະກັນແລ້ວ');await render()}catch(x){toast(x.message||x)}}
</script></body></html>
